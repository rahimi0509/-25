function downloadFile(name, content, mime) {
  const b = new Blob([content], { type: mime || 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function computeRange(from, to, userId) {
  const [patients, appts, exams, rxs, sales, labReqs, trxs, debts] = await Promise.all([
    DB.all('patients'), DB.all('appointments'), DB.all('exams'), DB.all('prescriptions'),
    DB.all('drugSales'), DB.all('labRequests'), DB.all('transactions'), DB.all('debts')
  ]);
  const inR = iso => iso && iso >= from && iso <= to;
  const newPatients = patients.filter(p => !p.deleted && inR((p.createdAt || '').slice(0, 10)));
  const examInR = exams.filter(e => !e.deleted && inR(e.date));
  const examPats = [...new Set(examInR.map(e => e.patientId))];
  const apptInR = appts.filter(a => !a.deleted && inR(a.date));
  const rxsInR = rxs.filter(r => !r.deleted && inR(r.date));
  const trxInR = trxs.filter(x => !x.voided && inR(x.date) && (!userId || x.userId === userId));
  const inc = k => sum(trxInR.filter(x => x.type === 'income' && x.source === k), x => x.amount);
  const income = { service: inc('service'), pharmacy: inc('pharmacy'), lab: inc('lab'), other: sum(trxInR.filter(x => x.type === 'income' && !['service', 'pharmacy', 'lab'].includes(x.source)), x => x.amount) };
  income.total = income.service + income.pharmacy + income.lab + income.other;
  const expRecs = (await DB.all('expenses')).filter(x => !x.deleted && inR(x.date));
  const opex = sum(trxInR.filter(x => x.type === 'expense' && !x.inv), x => x.amount);
  const invBuy = sum(trxInR.filter(x => x.type === 'expense' && x.inv), x => x.amount);
  const byCat = {};
  expRecs.forEach(x => byCat[x.category] = (byCat[x.category] || 0) + num(x.amount));
  const salesInR = sales.filter(s => !s.deleted && inR(s.date));
  const salesRev = sum(salesInR, s => s.total) - sum(salesInR, s => sum(s.returns || [], r => r.total));
  const salesCogs = sum(salesInR, s => sum(s.items || [], i => num(i.qty) * num(i.buyPrice)));
  const labInR = labReqs.filter(l => !l.deleted && inR(l.date) && l.status !== 'cancelled');
  /* cash end balance: cumulative until end of `to` */
  const bal = { cash: num(S.cashStart), bank: num(S.bankStart) };
  trxs.filter(x => !x.voided && x.date <= to).forEach(x => {
    const m = x.method === 'bank' ? 'bank' : 'cash';
    if (x.type === 'income') bal[m] += num(x.amount); else bal[m] -= num(x.amount);
  });
  /* series */
  const days = [];
  for (let d = from; d <= to; d = addDays(d, 1)) {
    days.push({
      k: d,
      l: fa(jOf(d).jd) + ' ' + jMonths[jOf(d).jm - 1],
      a: sum(trxs.filter(x => !x.voided && x.date === d && x.type === 'income'), x => x.amount),
      b: sum(trxs.filter(x => !x.voided && x.date === d && x.type === 'expense'), x => x.amount)
    });
    if (days.length > 400) break;
  }
  const months = [];
  if (jOf(from).jy === jOf(to).jy) {
    for (let m = 1; m <= 12; m++) {
      const f = isoOfJ(jOf(from).jy, m, 1), t2 = isoOfJ(jOf(from).jy, m, jalMonthLen(jOf(from).jy, m));
      if (f > to || t2 < from) continue;
      months.push({
        l: jMonths[m - 1],
        a: sum(trxs.filter(x => !x.voided && x.date >= f && x.date <= t2 && x.type === 'income'), x => x.amount),
        b: sum(trxs.filter(x => !x.voided && x.date >= f && x.date <= t2 && x.type === 'expense'), x => x.amount)
      });
    }
  }
  return {
    from, to, newPatients, examPats, examInR, apptInR, rxsInR, trxInR, income, opex, invBuy, byCat,
    profit: income.total - opex - invBuy,
    salesInR, salesRev, salesCogs, labInR, bal,
    days, months,
    receivable: sum(debts.filter(d => d.partyType === 'patient' && d.status === 'open'), d => d.amount - d.paid),
    payable: sum(debts.filter(d => d.partyType === 'supplier' && d.status === 'open'), d => d.amount - d.paid)
  };
}

        let list;
        if (k === 'inc-all') list = R.trxInR.filter(x => x.type === 'income');
        else if (k === 'exp-all') list = R.trxInR.filter(x => x.type === 'expense');
        else list = R.trxInR.filter(x => x.type === 'income' && (src === 'other' ? !['service', 'pharmacy', 'lab'].includes(x.source) : x.source === src));
        return drillTrxList(title, list);
      }
    });
    async function drillDebts(kind) {
      const debts = (await DB.all('debts')).filter(d => d.partyType === kind && d.status === 'open');
      drillList(title + ' — ' + (kind === 'patient' ? t('بدهی مریضان') : t('طلب تأمین‌کنندگان')),
        debts.map(d => [d.partyName, money(d.amount), money(d.paid), money(d.amount - d.paid)]),
        [t('نام'), t('کل'), t('پرداخت‌شده'), t('باقی‌مانده')]);
    }
  };
  await renderRepBody();
  const pb = view.querySelector('[data-rprint]');
  if (pb) pb.onclick = () => body.querySelector('[data-rprint2]').click();
  const xb = view.querySelector('[data-rxls]');
  if (xb) xb.onclick = () => body.querySelector('[data-rxls2]').click();
};
function drillList(title, rows, cols) {
  UI.modal({
    title: title, xw: true,
    body: tableEl(cols.map(h => ({ h })), rows.map(r => ({ cells: r.map(v => ({ v: esc(v) })) })),
      { empty: t('موردی یافت نشد') })
  });
}
function drillTrxList(title, list) {
  UI.modal({
    title: title, xw: true,
    body: tableEl([{ h: t('شماره') }, { h: t('تاریخ') }, { h: t('شرح') }, { h: t('مبلغ') }, { h: t('روش') }, { h: t('کاربر') }],
      list.map(x => ({ cells: [
        { v: esc(x.no) }, { v: fmtJ(x.date) + ' ' + fa(x.time || '') }, { v: esc(x.note || '') },
        { v: '<b class="num">' + money(x.amount) + '</b>' }, { v: esc(t(PAY_METHOD[x.method] || '')) }, { v: esc(x.userName || '') }
      ] })), { empty: t('تراکنشی یافت نشد') })
  });
}

function printReport(title, R, bodyEl) {

<script>
/* ==================== staff & permissions ==================== */
Routes.staff = { mod: 'staff', title: 'کاربران و مجوزها', render: (...a) => Pages.staff(...a) };
Pages.staff = async function (view) {
  const users = (await DB.all('users')).filter(u => !u.deleted);
  view.innerHTML =
    '<div class="page-head"><h2>' + t('مدیریت کارمندان و کاربران') + '</h2><div class="grow"></div>' +
    (can('staff', 'c') ? '<button class="btn primary" data-newu>' + ic('plus') + t('کاربر جدید') + '</button>' : '') + '</div>' +
    '<div class="hint" style="margin-bottom:12px">' + ic('shield') + ' ' + t('مجوزها در سرور دیتابیس محلی اعمال می‌شوند: هر عملیات ثبت/ویرایش/حذف قبل از اجرا با سطح دسترسی کاربر بررسی می‌شود، نه فقط با مخفی‌کردن منوها') + '</div>' +
    tableEl([{ h: t('کاربر') }, { h: t('نام کاربری') }, { h: t('نقش') }, { h: t('وضعیت') }, { h: t('آخرین ورود') }, { h: '' }],
      users.map(u => ({ cells: [
        { v: '<span class="avatar sm" style="display:inline-flex;vertical-align:middle;margin-inline-end:7px">' + esc((u.name || '؟').charAt(0)) + '</span><b>' + esc(u.name) + '</b>' },
        { v: '<span class="num ltr">' + esc(u.username) + '</span>' },
        { v: '<span class="badge ' + (u.role === 'doctor' ? 'b-violet' : 'b-blue') + '">' + esc(t(ROLE_L[u.role])) + '</span><br><small class="text-dim fs-xs">' + esc(t(ROLE_DESC[u.role] || '')) + '</small>' },
        { v: u.active ? '<span class="badge b-green">' + t('فعال') + '</span>' : '<span class="badge b-gray">' + t('غیرفعال') + '</span>' },
        { v: u.lastLogin ? fmtDT(u.lastLogin) : '—' },
        { v: staffActs(u), cls: 'acts' }
      ] })), { empty: t('کاربری ثبت نشده') });
  const nb = view.querySelector('[data-newu]');
  if (nb) nb.onclick = () => openUserForm(null).then(() => Pages.staff(view));
  view.querySelectorAll('[data-uact]').forEach(b => b.onclick = () => userAction(b.dataset.uact, b.dataset.id));
};
function staffActs(u) {
  let h = '';
  if (can('staff', 'e')) {
    h += '<button class="iconbtn" data-uact="perms" data-id="' + u.id + '" title="' + t('مجوزها') + '">' + ic('shield') + '</button>' +
      '<button class="iconbtn" data-uact="edit" data-id="' + u.id + '" title="' + t('ویرایش') + '">' + ic('edit') + '</button>' +
      '<button class="iconbtn" data-uact="pass" data-id="' + u.id + '" title="' + t('تغییر رمز') + '">' + ic('lock') + '</button>' +
      (u.id !== session.user.id ? '<button class="iconbtn" data-uact="toggle" data-id="' + u.id + '" title="' + (u.active ? t('غیرفعال‌سازی') : t('فعال‌سازی')) + '">' + ic(u.active ? 'x' : 'check') + '</button>' : '');
  }
  if (can('staff', 'd') && u.role !== 'doctor')
    h += '<button class="iconbtn" data-uact="del" data-id="' + u.id + '" title="' + t('حذف') + '">' + ic('trash') + '</button>';
  return h || '—';
}
async function userAction(act, id) {
  const u = await DB.get('users', id);
  if (!u) return;
  if (act === 'perms') return openPermMatrix(u);
  if (act === 'edit') { await openUserForm(u); Pages.staff(document.getElementById('view')); }
  if (act === 'pass') {
    const r = await UI.form([
      { k: 'p1', label: t('رمز عبور جدید'), type: 'password', req: true },
      { k: 'p2', label: t('تکرار رمز جدید'), type: 'password', req: true }
    ], { title: t('تغییر رمز — ' + u.name), submit: t('تغییر رمز') });
    if (!r) return;
    if (r.p1.length < 6) return UI.toast(t('رمز حداقل ۶ کاراکتر باشد'), 'bad');
    if (r.p1 !== r.p2) return UI.toast(t('رمزها یکسان نیستند'), 'bad');
    await Auth.setUserPass(u, r.p1);
    UI.toast(t('رمز تغییر کرد'), 'ok');
  }
  if (act === 'toggle') {
    if (u.role === 'doctor') {
      const docs = (await DB.all('users')).filter(x => x.role === 'doctor' && x.active && !x.deleted);
      if (docs.length <= 1) return UI.toast(t('حداقل یک داکتر فعال باید باقی بماند'), 'bad');
    }
    const ok = await UI.confirm(u.active ? t('این کاربر غیرفعال شود؟ ورود او مسدود می‌گردد') : t('این کاربر فعال شود؟'), { danger: u.active });
    if (!ok) return;
    u.active = !u.active;
    await DB.put('users', u);
    await Audit.log('edit', 'staff', u.id, u.username + ' → ' + (u.active ? 'active' : 'inactive'));
    Pages.staff(document.getElementById('view'));
  }
  if (act === 'del') {
    if (!(await UI.confirm(t('این کاربر حذف شود؟ سابقه فعالیت‌های او باقی می‌ماند'), { danger: true }))) return;
    u.deleted = true; u.deletedAt = nowFull();
    await DB.put('users', u);
    await Audit.log('delete', 'staff', u.id, u.username);
    Pages.staff(document.getElementById('view'));
  }
}
async function openUserForm(u) {
  const isNew = !u;
  const r = await UI.form([
    { k: 'name', label: t('نام کامل'), req: true, half: true },
    { k: 'username', label: t('نام کاربری'), req: true, half: true, disabled: !isNew, ph: 'reception1' },
    { k: 'role', label: t('نقش'), type: 'select', req: true, options: Object.entries(ROLE_L).map(([v, l]) => ({ v, l: t(l) })), half: true },
    { k: 'p1', label: isNew ? t('رمز عبور') : t('رمز جدید (اختیاری)'), type: 'password', half: true }
  ], { title: isNew ? t('ایجاد کاربر جدید') : t('ویرایش کاربر'), values: u || {} });
  if (!r) return;
  if (isNew) {
    if (!r.p1 || r.p1.length < 6) return UI.toast(t('رمز حداقل ۶ کاراکتر باشد'), 'bad');
    try {
      const rec = await Auth.createUser({ username: r.username, name: r.name, role: r.role, pass: r.p1, perms: rolePerms(r.role) });
      UI.toast(t('کاربر ایجاد شد'), 'ok');
      openPermMatrix(rec);
    } catch (e) { UI.toast(e.message, 'bad'); }
  } else {
    const roleChanged = r.role !== u.role;
    u.name = r.name.trim();
    if (roleChanged) {
      u.role = r.role;
      u.perms = rolePerms(r.role);
      UI.toast(t('نقش تغییر کرد و مجوزهای پیش‌فرض نقش اعمال شد'), 'info');
    }
    await DB.put('users', u);
    await Audit.log('edit', 'staff', u.id, u.username + (roleChanged ? ' → ' + r.role : ''));
    if (r.p1) {
      if (r.p1.length < 6) return UI.toast(t('رمز حداقل ۶ کاراکتر باشد'), 'bad');
      await Auth.setUserPass(u, r.p1);
    }
  }
}
function openPermMatrix(u) {
  const m = UI.modal({
    title: t('مجوزهای') + ' ' + esc(u.name) + ' — ' + esc(t(ROLE_L[u.role])),
    xw: true,
    body: '<div class="perm-mat"><table><tr><th>' + t('بخش') + '</th>' +
      Object.values(PERM_ACTS).map(a => '<th>' + esc(t(a)) + '</th>').join('') + '</tr>' +
      MODULES.map(mod => '<tr><td>' + esc(t(MODULE_L[mod] || mod)) + '</td>' +
        Object.keys(PERM_ACTS).map(a => '<td><input type="checkbox" data-pm="' + mod + '.' + a + '"' +
          (u.perms[mod] && u.perms[mod][a] ? ' checked' : '') + '></td>').join('') + '</tr>').join('') +
      '</table></div>' +
      '<div class="hint" style="margin-top:8px">' + ic('info') + ' ' + t('این مجوزها در تمام عملیات‌ها (ثبت، ویرایش، حذف، چاپ و نمایش) به‌صورت واقعی اعمال می‌شوند') + '</div>',
    foot: '<button class="btn ghost" data-pc>' + t('انصراف') + '</button><button class="btn primary" data-ps>' + ic('save') + t('ذخیره مجوزها') + '</button>',
    onClose: () => {}
  });
  m.el.querySelector('[data-pc]').onclick = () => m.close();
  m.el.querySelector('[data-ps]').onclick = async () => {
    const perms = {};
    MODULES.forEach(mod => { perms[mod] = {}; });
    m.el.querySelectorAll('[data-pm]').forEach(c => {
      const [mod, a] = c.dataset.pm.split('.');
      perms[mod][a] = c.checked ? 1 : 0;
    });
    u.perms = perms;
    await DB.put('users', u);
    await Audit.log('edit', 'staff', u.id, t('مجوزهای') + ' ' + u.username);
    m.close();
    UI.toast(t('مجوزها ذخیره شد'), 'ok');
    if (session.user.id === u.id) { session.user = u; buildNav(); }
    Pages.staff(document.getElementById('view'));
  };
}

      '<div class="searchbox">' + ic('search') + '<input class="input" id="auQ" placeholder="' + t('جستجو در جزئیات') + '" value="' + esc(audFilter.q) + '"></div>' +
    '</div>' +
    tableEl([{ h: t('زمان') }, { h: t('کاربر') }, { h: t('عملیات') }, { h: t('بخش') }, { h: t('جزئیات') }, { h: t('دلیل') }],
      list.slice(0, 300).map(a => ({ cells: [
        { v: '<span class="fs-s num">' + esc(a.ts) + '</span>' },
        { v: '<b>' + esc(a.userName) + '</b><br><small class="text-dim fs-xs">' + esc(t(ROLE_L[a.role]) || a.role) + '</small>' },
        { v: '<span class="badge ' + (String(a.action).startsWith('delete') || a.action === 'trx-void' ? 'b-red' : a.action === 'login' || a.action === 'logout' ? 'b-blue' : 'b-gray') + '">' + esc(t(ACTION_L[a.action] || a.action)) + '</span>' },
        { v: esc(t(MODULE_L[a.module] || a.module)) },
        { v: '<span class="fs-s">' + esc(a.details || '—') + '</span>' },

      ] })), { empty: t('موردی یافت نشد') });
  view.querySelector('#auU').onchange = e => { audFilter.user = e.target.value; Pages.audit(view); };
  view.querySelector('#auM').onchange = e => { audFilter.module = e.target.value; Pages.audit(view); };
  view.querySelector('#auFrom').onchange = e => { audFilter.from = e.target.value; Pages.audit(view); };

/* ==================== thermal bluetooth (ESC/POS) ==================== */
const Thermal = {
  async print(canvas) {
    if (!navigator.bluetooth) throw new Error(t('مرورگر شما از بلوتوث پشتیبانی نمی‌کند. Chrome/Edge (اندروید یا دسکتاپ) و اجرای برنامه روی HTTPS یا localhost لازم است. به‌جای آن از چاپ عادی استفاده کنید'));
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
    });
    const server = await device.gatt.connect();
    const services = await server.getPrimaryServices();
    let char = null;
    for (const s of services) {
      const chs = await s.getCharacteristics();
      const c = chs.find(ch => ch.properties.write || ch.properties.writeWithoutResponse);
      if (c) { char = c; break; }
    }
    if (!char) throw new Error(t('خصیصه نوشتن روی پرینتر یافت نشد'));
    const bytes = Thermal.rasterBytes(canvas);
    await char.writeValue(new Uint8Array([0x1b, 0x40]));
    for (let i = 0; i < bytes.length; i += 480) {
      await char.writeValue(bytes.slice(i, Math.min(bytes.length, i + 480)));
      await new Promise(r => setTimeout(r, 70));
    }
    try { await char.writeValue(new Uint8Array([0x1d, 0x56, 0x42, 0x00])); } catch (e) {}
    Audit.log('btprint', 'system', null, device.name || '');
  },
  rasterBytes(canvas) {
    const w = canvas.width, h = canvas.height;
    const img = canvas.getContext('2d').getImageData(0, 0, w, h).data;
    const rowBytes = Math.ceil(w / 8);
    const data = new Uint8Array(rowBytes * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const lum = 0.299 * img[i] + 0.587 * img[i + 1] + 0.114 * img[i + 2];
      if (lum < 140) data[y * rowBytes + (x >> 3)] |= 0x80 >> (x & 7);
    }
    const head = [0x1d, 0x76, 0x30, 0x6d, rowBytes & 0xff, (rowBytes >> 8) & 0xff, h & 0xff, (h >> 8) & 0xff];
    return new Uint8Array([...head, ...data]);
  },
  receiptCanvas(lines, widthMm) {
    const W = widthMm === '58mm' ? 384 : 576;
    const lh = 28;
    const H = lines.reduce((a, l) => a + (l.sep ? 20 : (l.h ? 40 : 30)), 24);
    const c = document.createElement('canvas');
    c.width = W; c.height = Math.max(H, 120);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, c.height);
    ctx.fillStyle = '#000';
    let y = 16;
    lines.forEach(l => {
      if (l.sep) {
        ctx.fillRect(12, y + 8, W - 24, 2);
        y += 20; return;
      }
      ctx.font = (l.b ? 'bold ' : '') + (l.h ? '22' : '17') + 'px Tahoma, sans-serif';
      ctx.direction = 'rtl';
      ctx.textAlign = l.c ? 'center' : 'right';
      ctx.fillText(String(l.t || ''), l.c ? W / 2 : W - 12, y + 20);
      y += l.h ? 40 : 30;
    });
    return c;
  }
};

const BACKUP_STORES = ['users','patients','appointments','exams','prescriptions','drugs','drugSales','purchases',

    UI.toast(t('فایل پشتیبان دانلود شد — آن را در جای امن نگه دارید'), 'ok', 5000);

  async importFile(file, mode) {
    const txt = await file.text();
    let dump;
    try { dump = JSON.parse(txt); } catch (e) { throw new Error(t('فایل پشتیبان معتبر نیست')); }
    if (!dump || !dump.data || dump.app !== 'mtb-clinic') throw new Error(t('این فایل پشتیبان این سیستم نیست'));
    if (mode === 'replace') {
      for (const s of BACKUP_STORES) {
        await DB.clear(s);
        for (const r of (dump.data[s] || [])) await DB.put(s, r);
      }

      for (const s of BACKUP_STORES) for (const r of (dump.data[s] || [])) await DB.put(s, r);
    }
    await loadSettings();
    await Audit.log('import-backup', 'system', null, mode + ' — ' + dump.exportedAt);
    return dump;
  }
};

<script>
/* ==================== Supabase sync engine (REST, real) ====================
   مدل جدول سرور: هر جدول = (id text PK, updated_at timestamptz, data jsonb)
   کل رکورد برنامه داخل data ذخیره می‌شود → sync عمومی و بدون نگاشت ستون‌ها.
   احراز هویت: یا anon key (با کلید syncOpen در تنظیمات سرور) یا ایمیل/رمز Supabase Auth.
=========================================================================== */
const SB_TABLES = {
  patients: ['patients', 'patients'], appointments: ['appointments', 'appointments'],
  exams: ['exams', 'exams'], prescriptions: ['prescriptions', 'prescriptions'],
  drugs: ['drugs', 'pharmacy'], drugSales: ['drug_sales', 'pharmacy'],
  purchases: ['purchases', 'pharmacy'], labTests: ['lab_tests', 'lab'],
  labRequests: ['lab_requests', 'lab'], services: ['services', 'services'],
  expenses: ['expenses', 'expenses'], transactions: ['transactions', 'accounting'],
  debts: ['debts', 'accounting']
};
let sbToken = null;
const SB = {
  cfg() { const c = S.supabase || {}; return (c.enabled && c.url && c.key) ? c : null; },
  stampTs(s) { const t = new Date(s || '').getTime(); return isNaN(t) ? 0 : t; },
  recStamp(r) { return r.editedAt || r.confirmedAt || r.completedAt || r.createdAt || ''; },
  async login() {
    const c = this.cfg();
    if (!c.email || !c.pass) { sbToken = null; return; }
    const r = await fetch(c.url.replace(/\/$/, '') + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: { 'apikey': c.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: c.email, password: c.pass })
    });
    if (!r.ok) throw new Error(t('ورود به Supabase ناموفق بود — ایمیل/رمز یا تنظیمات Auth را بررسی کنید'));
    const j = await r.json();
    sbToken = j.access_token || null;
  },
  hdrs(extra) {
    const c = this.cfg();
    const h = { 'apikey': c.key, 'Content-Type': 'application/json' };
    h['Authorization'] = 'Bearer ' + (sbToken || c.key);
    return Object.assign(h, extra || {});
  },
  async test() {
    const c = this.cfg(); if (!c) throw new Error(t('اتصال Supabase فعال نیست'));
    const r = await fetch(c.url.replace(/\/$/, '') + '/rest/v1/patients?select=id&limit=1', { headers: this.hdrs() });
    if (!r.ok) { const txt = await r.text(); throw new Error(t('اتصال ناموفق') + ' (' + r.status + '): ' + txt.slice(0, 120)); }
    return true;
  },
  async pushTable(store, table) {
    const c = this.cfg();
    const last = ((S.syncState || {}).lastPush || {})[store] || '';
    const all = await DB.all(store); /* حذف‌نرم‌ها هم برای همگام شدن حذف ارسال می‌شوند */
    const rows = all.filter(x => !last || (x.editedAt || x.createdAt || '') >= last);
    if (!rows.length) return 0;
    const payload = rows.map(r => ({ id: r.id, updated_at: new Date().toISOString(), data: r }));
    const r = await fetch(c.url.replace(/\/$/, '') + '/rest/v1/' + table + '?on_conflict=id', {
      method: 'POST', headers: this.hdrs({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(payload)
    });
    if (!r.ok) { const txt = await r.text(); throw new Error(t('ارسال') + ' ' + table + ' (' + r.status + '): ' + txt.slice(0, 140)); }
    return rows.length;
  },
  async pullTable(store, table) {
    const c = this.cfg();
    const last = ((S.syncState || {}).lastPull || {})[store] || '1970-01-01';
    const r = await fetch(c.url.replace(/\/$/, '') + '/rest/v1/' + table +
      '?select=*&updated_at=gt.' + encodeURIComponent(last), { headers: this.hdrs() });
    if (!r.ok) return { merged: 0, serverCount: -1 };
    const rows = await r.json();
    let merged = 0;
    for (const row of rows) {
      if (!row || !row.id || !row.data) continue;
      const local = await DB.get(store, row.id);
      const localTs = this.stampTs(local ? this.recStamp(local) : '');
      const srvTs = this.stampTs(row.updated_at);
      if (!local || srvTs >= localTs) { const d = row.data; d.id = row.id; await DB.put(store, d); merged++; }
    }
    return { merged, serverCount: rows.length };
  },
  async syncAll(progress) {
    const c = this.cfg(); if (!c) throw new Error(t('اتصال Supabase فعال نیست'));
    if (!navigator.onLine) throw new Error(t('آفلاین هستید — بعداً دوباره تلاش کنید'));
    await this.login();
    await this.test();
    const st = S.syncState = S.syncState || { lastPush: {}, lastPull: {} };
    let pushed = 0, pulled = 0;
    for (const [store, [table]] of Object.entries(SB_TABLES)) {
      if (progress) progress(t('دریافت') + ': ' + store);
      const pr = await this.pullTable(store, table);
      pulled += pr.merged;
      if (progress) progress(t('ارسال') + ': ' + store);
      /* اگر سرور برای این جدول خالی بود ولی داده محلی داریم → ارسال کامل */
      if (pr.serverCount === 0) {
        const lc = await DB.count(store);
        if (lc > 0) st.lastPush[store] = '';
      }
      pushed += await this.pushTable(store, table);
      st.lastPush[store] = nowFull();
      st.lastPull[store] = new Date(new Date(st.lastPush[store]).getTime() - 60000).toISOString();
    }
    await saveSettings({ syncState: st, sbLastSync: nowFull() });
    await Audit.log('sync', 'system', null, 'push:' + pushed + ' pull:' + pulled);
    return { pushed, pulled };
  },
  schedule() {
    const c = this.cfg(); if (!c) return;
    if (SB._timer) clearInterval(SB._timer);
    const min = Math.max(5, num(c.autoMin) || 15);
    SB._timer = setInterval(async () => {
      if (navigator.onLine && !session?.locked) {
        try { await SB.syncAll(); updateSyncPill(); } catch (e) { console.warn('sb-auto', e.message); }
      }
    }, min * 60000);
  }
};

/* ==================== Google Sheets engine (Apps Script Web App) ==================== */
const GS = {
  cfg() { const c = S.gsheet || {}; return (c.enabled && c.url) ? c : null; },
  async post(payload) {
    const c = this.cfg(); if (!c) throw new Error(t('اتصال گوگل شیت فعال نیست'));
    const r = await fetch(c.url, { method: 'POST', body: JSON.stringify(payload) });
    if (!r.ok) throw new Error(t('ارسال به شیت ناموفق بود') + ' (' + r.status + ')');
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { return { raw: txt.slice(0, 100) }; }
  },
  async test() { const j = await this.post({ action: 'ping' }); if (!j.ok && !j.pong) throw new Error(t('پاسخ نامعتبر از Apps Script')); return j; },
  rowsFromTrx(list) {
    return [['شماره تراکنش', 'تاریخ', 'نوع', 'بخش', 'مبلغ (AFN)', 'روش', 'شرح', 'کاربر']].concat(
      list.map(x => [x.no, x.date, x.type === 'income' ? 'دریافت' : 'پرداخت',
        t(Trx_SRC_L[x.source] || x.source), Math.round(num(x.amount)), t(PAY_METHOD[x.method] || ''), x.note || '', x.userName || '']));
  },
  async pushTransactions() {
    const list = (await DB.all('transactions')).filter(x => !x.voided).sort((a, b) => (a.date).localeCompare(b.date)).slice(-1000);
    const j = await this.post({ action: 'replace', tab: 'Transactions', rows: this.rowsFromTrx(list) });
    await saveSettings({ gsLastSync: nowFull() });
    return list.length;
  },
  async pushDailyReport() {
    const R = await computeRange(nowISO(), nowISO(), '');
    const rows = [
      ['گزارش روزانه', fmtJ(nowISO(), 'long'), S.clinicName || ''],
      ['معاینات', R.examInR.length], ['مریضان جدید', R.newPatients.length],
      ['نوبت‌ها', R.apptInR.length], ['نسخه‌ها', R.rxsInR.length], ['آزمایش‌ها', R.labInR.length],
      ['فروش داروخانه', Math.round(R.salesRev)], ['عواید خدمات', Math.round(R.income.service)],
      ['عواید لابراتوار', Math.round(R.income.lab)], ['مصارف', Math.round(R.opex + R.invBuy)],
      ['سود خالص', Math.round(R.profit)], ['صندوق', Math.round(R.bal.cash)], ['بانک', Math.round(R.bal.bank)],
      ['بدهی مریضان', Math.round(R.receivable)]
    ];
    const j = await this.post({ action: 'replace', tab: 'DailyReport-' + nowISO(), rows });
    if ((S.gsheet || {}).autoDaily) await saveSettings({ gsLastDaily: nowISO() });
    return rows.length;
  },
  async pushPatients() {
    const pts = (await DB.all('patients')).filter(p => !p.deleted);
    const rows = [['شماره پرونده', 'نام', 'نام پدر', 'سن', 'جنسیت', 'تلفن', 'آدرس', 'تاریخ ثبت']].concat(
      pts.map(p => [p.fileNo, pName(p), p.fatherName || '', num(p.age), t(GENDER_L[p.gender] || ''), toEn(p.phone || ''), p.address || '', (p.createdAt || '').slice(0, 10)]));
    return (await this.post({ action: 'replace', tab: 'Patients', rows })).ok;
  },
  async pushLowStock() {
    const drugs = (await DB.all('drugs')).filter(d => !d.deleted);
    const today = nowISO();
    const low = drugs.filter(d => num(d.qty) <= num(d.minQty || 0));
    const exp = drugs.filter(d => d.expiry && d.expiry <= addDays(today, 60));
    const rows = [['نوع هشدار', 'دوا', 'موجودی', 'انقضا']].concat(
      low.map(d => ['کم‌موجود', d.name, num(d.qty), d.expiry || '']).concat(
        exp.map(d => ['نزدیک انقضا', d.name, num(d.qty), d.expiry])));
    return (await this.post({ action: 'append', tab: 'Alerts', rows })).ok;
  },
  async pushBackup() {
    const stores = ['patients','appointments','exams','prescriptions','drugs','drugSales','purchases','labTests','labRequests','services','expenses','transactions','debts'];
    let n = 0;
    for (const s of stores) {
      const recs = await DB.all(s);
      const rows = [['id', 'json', 'date']].concat(recs.map(r => [r.id, JSON.stringify(r), (r.createdAt || r.date || '').slice(0, 10)]));
      await this.post({ action: 'replace', tab: 'Backup-' + s, rows });
      n += recs.length;
    }
    await saveSettings({ gsLastBackup: nowFull() });
    return n;
  }
};
function syncAutoDailyCheck() {
  const g = S.gsheet || {};
  if (g.enabled && g.autoDaily && g.url && nowTime() >= '20:00' && g.gsLastDaily !== nowISO() && navigator.onLine) {
    GS.pushDailyReport().then(() => UI.toast(t('گزارش روزانه به گوگل شیت ارسال شد'), 'ok')).catch(() => {});
  }
}

    const f = bf.files[0];
    if (!f) return;
    const mode = view.querySelector('#bimpMode').value;

      const ok = await UI.confirm(t('همه داده‌های فعلی با فایل پشتیبان جایگزین می‌شود. مطمئن هستید؟'), { danger: true, yes: t('بلی، جایگزین کن') });

function renderCats() {
  const catList = (title, type, arr) =>
    '<b class="fs-s">' + esc(title) + '</b><div style="display:flex;flex-wrap:wrap;gap:7px;margin:8px 0">' +
    arr.map((c, i) => '<span class="badge b-violet" style="gap:8px">' + esc(typeof c === 'string' ? c : c.name) +
      '<button class="linkbtn" data-catdel="' + type + ':' + i + '" style="color:var(--bad)">×</button></span>').join('') +
    '<input class="input" data-catadd="' + type + '" placeholder="' + t('افزودن...') + '" style="width:130px;padding:5px 10px"></div>';
  return catList(t('دسته‌بندی مصارف'), 'exp', S.expCategories.map(c => c.name)) +
    catList(t('دسته‌بندی دواها'), 'drug', S.drugCategories) +
    catList(t('دسته‌بندی آزمایش‌ها'), 'lab', S.labCategories) +
    '<div class="hint">' + t('دسته‌های خرید دوا و مواد لابراتوار در بخش خرید موجودی داروخانه مدیریت می‌شوند') + '</div>';
}
function wireCats(view) {
  view.querySelectorAll('[data-catadd]').forEach(inp => inp.onkeydown = async e => {
    if (e.key !== 'Enter' || !inp.value.trim()) return;
    const v = inp.value.trim();
    if (inp.dataset.catadd === 'exp') S.expCategories.push({ id: uid(), name: v });
    if (inp.dataset.catadd === 'drug') S.drugCategories.push(v);
    if (inp.dataset.catadd === 'lab') S.labCategories.push(v);
    await saveSettings();
    view.querySelector('#cats').innerHTML = renderCats();
    wireCats(view);
  });
  view.querySelectorAll('[data-catdel]').forEach(b => b.onclick = async () => {
    const [type, idx] = b.dataset.catdel.split(':');
    if (type === 'exp') S.expCategories.splice(+idx, 1);
    if (type === 'drug') S.drugCategories.splice(+idx, 1);
    if (type === 'lab') S.labCategories.splice(+idx, 1);
    await saveSettings();
    view.querySelector('#cats').innerHTML = renderCats();
    wireCats(view);
  });
}
</script>

<script>
/* ==================== boot ==================== */
(async function boot() {
  applyLang();
  try {
    await DB.open();
    await loadSettings();
    await seedDefaults();
    const saved = sessionStorage.getItem('mtb_session');
    if (saved && !session) {
      const u = await Auth.findUser(saved);
      if (u && u.active) session = { user: u, ts: Date.now() };
    }
    if (session) enterApp();
    else renderAuth();
    SB.schedule();
    setInterval(syncAutoDailyCheck, 60000);
    window.addEventListener('online', () => { const c = SB.cfg(); if (c && session) SB.syncAll().then(() => updateSyncPill()).catch(() => {}); });
  } catch (e) {
    console.error(e);
    document.getElementById('authRoot').innerHTML =
      '<div class="screen"><div class="auth-card"><div class="auth-logo">' + ic('alert') + '</div>' +
      '<h1>خطا در راه‌اندازی</h1><div class="sub">' + esc(String(e.message || e)) + '</div>' +
      '<div class="hint">مرورگر را بازنشانی کنید یا از حالت ناشناس خارج شوید و دوباره باز کنید</div></div></div>';
  }
})();
</script>
