<script>
/* ==================== appointments ==================== */
Routes.appointments = { mod: 'appointments', title: 'نوبت‌ها', render: (...a) => Pages.appointments(...a) };
let apptState = { mode: 'day', date: nowISO() };
function timeSlots() {
  const out = [];
  const [sh, sm] = (S.workStart || '08:00').split(':').map(Number);
  const [eh, em] = (S.workEnd || '20:00').split(':').map(Number);
  const step = num(S.slotMin) || 15;
  let cur = sh * 60 + sm, end = eh * 60 + em;
  while (cur <= end) { out.push(pad2(Math.floor(cur / 60)) + ':' + pad2(cur % 60)); cur += step; }
  return out;
}
Pages.appointments = async function (view) {
  const { mode, date } = apptState;
  const appts = (await DB.all('appointments')).filter(a => !a.deleted);
  const pts = await DB.all('patients');
  const nameOf = id => { const p = pts.find(x => x.id === id); return p ? pName(p) : '—'; };
  const dateLabel = mode === 'month'
    ? monthLabel(jOf(date).jy, jOf(date).jm)
    : weekdayName(date) + ' ' + fmtJG(date);
  const shiftBtn = (dir, title) => '<button class="iconbtn" data-shift="' + dir + '" title="' + title + '">' + ic(dir > 0 ? 'chevL' : 'chevR') + '</button>';
  let body = '';
  if (mode === 'day') {
    const list = appts.filter(a => a.date === date).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    body = '<div class="cal-day-list">' + (list.length ? list.map(a => apptRowHtml(a, nameOf, pts)) : '') + '</div>' +
      '<div style="margin-top:12px">' + (list.length ? '' : emptyState(t('نوبتی برای این روز ثبت نشده'), t('با دکمه «نوبت جدید» وقت ثبت کنید'))) + '</div>' +
      (can('appointments', 'c') ? '<div style="margin-top:8px"><button class="btn primary" data-add>' + ic('plus') + t('نوبت جدید') + '</button></div>' : '');
  } else if (mode === 'week') {
    const start = weekStartISO(date);
    let cols = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      const isToday = d === nowISO();
      const list = appts.filter(a => a.date === d).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
      cols += '<div class="week-col' + (isToday ? ' today' : '') + '" data-day="' + d + '">' +
        '<h5>' + weekSatFirst[i] + '<br><b class="num">' + fmtJ(d) + '</b></h5>' +
        list.map(a => '<div class="w-appt" data-appt="' + a.id + '"><b>' + fa(a.time || '') + '</b> ' + esc(nameOf(a.patientId)) +
          (a.urgent ? ' ⚡' : '') + '</div>').join('') +
        (list.length ? '' : '<div class="fs-xs text-dim" style="text-align:center;margin-top:8px">—</div>') + '</div>';
    }
    body = '<div class="week-grid">' + cols + '</div>' +
      (can('appointments', 'c') ? '<div style="margin-top:12px"><button class="btn primary" data-add>' + ic('plus') + t('نوبت جدید') + '</button></div>' : '');
  } else {
    const j = jOf(date);
    const len = jalMonthLen(j.jy, j.jm);
    const g1 = toGregorian(j.jy, j.jm, 1);
    const startIdx = (new Date(g1.gy, g1.gm - 1, g1.gd).getDay() + 1) % 7;
    const todayJ = jOfDate(new Date());
    let cells = '';
    for (let i = 0; i < startIdx; i++) cells += '<div></div>';
    for (let d = 1; d <= len; d++) {
      const iso = isoOfJ(j.jy, j.jm, d);
      const list = appts.filter(a => a.date === iso && !['cancelled', 'noshow'].includes(a.status));
      const isToday = todayJ.jy === j.jy && todayJ.jm === j.jm && todayJ.jd === d;
      cells += '<div class="cal-cell' + (isToday ? ' today' : '') + '" data-day="' + iso + '">' +
        '<span class="dnum">' + fa(d) + '</span>' +
        list.slice(0, 2).map(a => '<span class="cal-chip ' + (APPT_STATUS[a.status] || APPT_STATUS.waiting).c + '">' + fa(a.time || '') + ' ' + esc(nameOf(a.patientId)) + '</span>').join('') +
        (list.length > 2 ? '<span class="fs-xs text-dim">+' + fa(list.length - 2) + '</span>' : '') +
        '</div>';
    }
    body = '<div class="cal-grid" style="margin-bottom:6px">' + weekSatFirst.map(d => '<div class="cal-dow">' + d + '</div>').join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>';
  }
  view.innerHTML =
    '<div class="page-head"><h2>' + t('مدیریت نوبت‌ها') + '</h2><div class="grow"></div>' +
    (can('appointments', 'c') ? '<button class="btn primary" data-add2>' + ic('plus') + t('نوبت جدید') + '</button>' : '') + '</div>' +
    '<div class="cal-head">' +
      '<div class="tabs" style="margin:0">' +
        [['day', t('روز')], ['week', t('هفته')], ['month', t('ماه')]].map(([k, l]) => '<button class="tab ' + (mode === k ? 'active' : '') + '" data-mode="' + k + '">' + esc(l) + '</button>').join('') +
      '</div>' +
      shiftBtn(-1, t('قبلی')) + '<b>' + dateLabel + '</b>' + shiftBtn(1, t('بعدی')) +
      '<button class="btn ghost sm" data-today2>' + t('امروز') + '</button>' +
    '</div>' + body;
  view.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { apptState.mode = b.dataset.mode; Pages.appointments(view); });
  view.querySelectorAll('[data-shift]').forEach(b => b.onclick = () => {
    const dir = +b.dataset.shift;
    if (mode === 'day') apptState.date = addDays(date, dir);
    else if (mode === 'week') apptState.date = addDays(date, dir * 7);
    else {
      let jy = jOf(date).jy, jm = jOf(date).jm + dir;
      if (jm < 1) { jm = 12; jy--; } if (jm > 12) { jm = 1; jy++; }
      apptState.date = isoOfJ(jy, jm, 1);
    }
    Pages.appointments(view);
  });
  view.querySelectorAll('[data-today2]').forEach(b => b.onclick = () => { apptState.date = nowISO(); Pages.appointments(view); });
  view.querySelectorAll('[data-add],[data-add2]').forEach(b => b.onclick = () => openApptForm(null, null, null).then(() => Pages.appointments(view)));
  view.querySelectorAll('[data-day]').forEach(el => el.onclick = e => {
    if (e.target.closest('[data-appt]') || e.target.closest('button')) return;
    apptState.mode = 'day'; apptState.date = el.dataset.day;
    Pages.appointments(view);
  });
  view.querySelectorAll('[data-appt]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    openApptView(el.dataset.appt, nameOf);
  });
  view.querySelectorAll('[data-ast]').forEach(b => b.onclick = async () => {
    const [st, id] = b.dataset.ast.split(':');
    const a = await DB.get('appointments', id);
    if (!a) return;
    a.status = st;
    await DB.put('appointments', a);
    await Audit.log('status-appt', 'appointments', id, APPT_STATUS[st].l);
    if (st === 'arrived' && isDoctor()) {
      UI.toast(t('مریض حاضر شد. می‌توانید معاینه را ثبت کنید'), 'info');
      setTimeout(() => { go('exams'); openExamForm(null, { patientId: a.patientId, apptId: a.id }); }, 500);
      return;
    }
    UI.toast(t('وضعیت نوبت به') + ' «' + APPT_STATUS[st].l + '» ' + t('تغییر کرد'), 'ok');
    refreshBadges();
    Pages.appointments(view);
  });
  view.querySelectorAll('[data-apdel]').forEach(b => b.onclick = async () => {
    if (!(await UI.confirm(t('این نوبت حذف شود؟'), { danger: true }))) return;
    const a = await DB.get('appointments', b.dataset.apdel);
    a.deleted = true;
    await DB.put('appointments', a);
    await Audit.log('delete', 'appointments', a.id, a.date + ' ' + a.time);
    Pages.appointments(view);
  });
  view.querySelectorAll('[data-aprem]').forEach(b => b.onclick = async () => {

};

}
async function openApptView(id, nameOf) {

    title: t('جزئیات نوبت'),

  }).el.querySelector('[data-close2]').onclick = function () { this.closest('.m-overlay').querySelector('[data-mx]').click(); };
}
async function openApptForm(a, _unused, prePatientId) {
  const isNew = !a;
  let patientId = a ? a.patientId : prePatientId || null;
  if (!patientId) {
    const pts = (await DB.all('patients')).filter(p => !p.deleted);
    if (!pts.length) { UI.toast(t('اول یک مریض ثبت کنید'), 'warn'); return; }
    const v = await UI.picker(pts.map(p => ({ v: p.id, l: pName(p), sub: p.fileNo + (p.phone ? ' — ' + toEn(p.phone) : '') })), { title: t('انتخاب مریض') });
    if (!v) return;
    patientId = v;
  }
  const slots = timeSlots();
  const samePatient = (await DB.all('appointments')).filter(x => !x.deleted && x.patientId === patientId && x.date === (a ? a.date : nowISO())).length;
  const v = await UI.form([
    { k: 'date', label: t('تاریخ نوبت'), type: 'date', val: a ? a.date : nowISO(), req: true },
    { k: 'time', label: t('ساعت مراجعه'), type: 'select', options: slots, val: a ? a.time : '', req: true, placeholder: t('انتخاب ساعت') },
    { k: 'urgent', label: t('نوبت فوری'), type: 'check' },
    { k: 'reason', label: t('شرح / دلیل مراجعه'), type: 'textarea', rows: 2, ph: t('مثلاً: چکاپ فشار خون') }
  ], {
    title: isNew ? t('ثبت نوبت جدید') : t('ویرایش نوبت'), submit: isNew ? t('ثبت نوبت') : t('ذخیره'),
    hint: '', values: a || {}
  });
  if (!v) return;
  const all = (await DB.all('appointments')).filter(x => !x.deleted);
  const dup = all.find(x => x.date === v.date && x.time === v.time && x.id !== (a ? a.id : null));
  if (dup) { UI.toast(t('در این زمان قبلاً نوبت ثبت شده است. ساعت دیگری انتخاب کنید'), 'bad', 4500); return openApptForm(a, null, patientId); }
  if (!isNew && samePatient === 0 && all.some(x => x.patientId === patientId && x.date === v.date && x.id !== a.id && !['cancelled', 'noshow'].includes(x.status)) && !(await UI.confirm(t('برای این مریض در همین روز نوبت دیگری نیز وجود دارد. ادامه می‌دهید؟')))) return;
  if (isNew && samePatient && !(await UI.confirm(t('این مریض قبلاً در این تاریخ نوبت دارد. باز هم ثبت شود؟')))) return;
  const rec = {
    id: isNew ? uid() : a.id, patientId, date: v.date, time: v.time,
    urgent: !!v.urgent, reason: v.reason.trim(), status: isNew ? 'waiting' : (v.urgent && a.status === 'waiting' ? 'waiting' : a.status),
    reminded: a ? a.reminded : false,
    createdAt: a ? a.createdAt : nowFull(), createdBy: session.user.id
  };
  await DB.put('appointments', rec);
  await Audit.log(isNew ? 'create' : 'edit', 'appointments', rec.id, fmtJ(v.date, 'long') + ' ' + v.time);
  UI.toast(isNew ? t('نوبت ثبت شد') : t('نوبت به‌روز شد'), 'ok');
  refreshBadges();
}

<script>
/* ==================== exams ==================== */
Routes.exams = { mod: 'exams', title: 'معاینات', render: (...a) => Pages.exams(...a) };
let examQ = '', examDateFilter = '';
const VITAL_FIELDS = [
  ['bp', 'فشار خون', 'mmHg'], ['pulse', 'نبض', 'ض/د'], ['temp', 'درجه حرارت', '°C'],
  ['weight', 'وزن', 'kg'], ['height', 'قد', 'cm'], ['spo2', 'اکسیژن خون', '%'], ['resp', 'تنفس', 'ض/د']
];
Pages.exams = async function (view, param) {
  if (param) return Pages.examDetail(view, param);
  const exams = (await DB.all('exams')).filter(e => !e.deleted);
  const pts = await DB.all('patients');
  const nameOf = id => { const p = pts.find(x => x.id === id); return p ? pName(p) : '—'; };
  let list = exams;
  const q = examQ.trim().toLowerCase();
  if (q) list = list.filter(e => nameOf(e.patientId).toLowerCase().includes(q));
  if (examDateFilter === 'today') list = list.filter(e => e.date === nowISO());
  else if (examDateFilter === 'pending') list = list.filter(e => !e.confirmed);
  else if (/^\d{4}-\d{2}-\d{2}$/.test(examDateFilter)) list = list.filter(e => e.date === examDateFilter);
  list.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const rows = list.slice(0, 200).map(e => ({
    attr: 'data-open="' + e.id + '" style="cursor:pointer"',
    cells: [
      { v: fmtJG(e.date) + '<br><small class="text-dim num">' + fa(e.time || '') + '</small>' },
      { v: '<b>' + esc(nameOf(e.patientId)) + '</b>' },
      { v: '<span class="fs-s">' + esc(e.complaint || '—') + '</span>' },
      { v: canSeeMedical() ? '<span class="fs-s">' + esc(e.diagnosis || '—') + '</span>' : '<span class="text-dim">—</span>' },
      { v: esc(e.doctorName || (e.createdByName || '—')) },
      { v: e.confirmed ? '<span class="badge b-green">' + t('تأییدشده') + '</span>' : '<span class="badge b-amber">' + t('در انتظار تأیید') + '</span>' },
      { v: examActions(e), cls: 'acts' }
    ]
  }));
  view.innerHTML =
    '<div class="page-head"><h2>' + t('معاینات و پرونده طبی') + '</h2><div class="grow"></div>' +
    '<button class="btn primary" data-new>' + ic('plus') + t('معاینه جدید') + '</button></div>' +
    '<div class="toolbar">' +
      '<div class="searchbox">' + ic('search') + '<input class="input" id="examQ" placeholder="' + t('جستجو با نام مریض') + '" value="' + esc(examQ) + '"></div>' +
      '<select class="input select" id="examF" style="width:auto">' +
        '<option value="">' + t('همه تاریخ‌ها') + '</option>' +
        '<option value="today"' + (examDateFilter === 'today' ? ' selected' : '') + '>' + t('امروز') + '</option>' +
        '<option value="pending"' + (examDateFilter === 'pending' ? ' selected' : '') + '>' + t('در انتظار تأیید') + '</option>' +
      '</select>' +
    '</div>' + tableEl(
      [{ h: t('تاریخ') }, { h: t('مریض') }, { h: t('شکایت اصلی') }, { h: t('تشخیص') }, { h: t('داکتر') }, { h: t('وضعیت') }, { h: '' }],
      rows, { empty: t('معاینه‌ای ثبت نشده'), emptySub: t('با دکمه «معاینه جدید» شروع کنید') });
  view.querySelectorAll('[data-open]').forEach(tr => tr.onclick = e => { if (!e.target.closest('button')) go('exams', tr.dataset.open); });
  view.querySelectorAll('[data-act]').forEach(b => b.onclick = () => examAction(b.dataset.act, b.dataset.id));
  view.querySelector('[data-new]').onclick = () => openExamForm(null, null).then(() => Pages.exams(view));
  view.querySelector('#examQ').oninput = debounce(e => { examQ = e.target.value; Pages.exams(view); }, 250);
  view.querySelector('#examF').onchange = e => { examDateFilter = e.target.value; Pages.exams(view); };
};
function examActions(e) {
  let h = '<button class="iconbtn" data-act="open" data-id="' + e.id + '">' + ic('eye') + '</button>';
  if (can('exams', 'e') && (!e.confirmed || isDoctor()))
    h += '<button class="iconbtn" data-act="edit" data-id="' + e.id + '">' + ic('edit') + '</button>';
  if (can('exams', 'd') && isDoctor())
    h += '<button class="iconbtn" data-act="del" data-id="' + e.id + '">' + ic('trash') + '</button>';
  return h;
}
async function examAction(act, id) {
  const e = await DB.get('exams', id);
  if (!e) return;
  if (act === 'open') go('exams', id);
  if (act === 'edit') openExamForm(e, null).then(() => Pages.exams(document.getElementById('view')));
  if (act === 'del') {
    if (!(await UI.confirm(t('این معاینه حذف شود؟ سابقه در تاریخچه ثبت می‌ماند'), { danger: true }))) return;
    e.deleted = true;
    await DB.put('exams', e);
    await Audit.log('delete', 'exams', id, fmtJ(e.date) + ' ' + pName(await DB.get('patients', e.patientId)));
    Pages.exams(document.getElementById('view'));
  }
}
async function openExamForm(exam, prefill) {
  const isNew = !exam;
  prefill = prefill || {};
  let patientId = isNew ? (prefill.patientId || null) : exam.patientId;
  if (!patientId) {
    const pts = (await DB.all('patients')).filter(p => !p.deleted);
    if (!pts.length) { UI.toast(t('اول یک مریض ثبت کنید'), 'warn'); return; }
    const v = await UI.picker(pts.map(p => ({ v: p.id, l: pName(p), sub: p.fileNo })), { title: t('انتخاب مریض برای معاینه') });
    if (!v) return;
    patientId = v;
  }
  let reason = null;
  if (!isNew && exam.confirmed) {
    reason = await UI.askReason(t('اصلاح معاینه تأییدشده — ثبت دلیل الزامی است'), true);
    if (!reason) return;
  }
  const vit = (isNew ? {} : (exam.vitals || {}));
  const fields = [
    { k: 'date', label: t('تاریخ معاینه'), type: 'date', val: isNew ? nowISO() : exam.date, req: true, half: true },
    { k: 'complaint', label: t('شکایت اصلی مریض'), type: 'textarea', rows: 2, req: true, ph: t('مثلاً: سردرد از سه روز، تب و سرفه') },
    { k: 'symptoms', label: t('علایم و سابقه بیماری'), type: 'textarea', rows: 2, ph: t('توضیح علایم، مدت، سابقه دارویی...') }
  ];
  VITAL_FIELDS.forEach(([k, l, u]) => fields.push({ k: 'v_' + k, label: l + (u ? ' (' + u + ')' : ''), half: true, type: 'text', val: vit[k] || '', ph: k === 'bp' ? '120/80' : '' }));
  if (canSeeMedical()) {
    fields.push({ k: 'diagnosis', label: t('تشخیص داکتر'), type: 'textarea', rows: 3, val: isNew ? '' : exam.diagnosis, ph: t('تشخیص طبی — توسط داکتر ثبت می‌شود') });
    fields.push({ k: 'plan', label: t('برنامه درمان و توصیه‌های طبی'), type: 'textarea', rows: 3, val: isNew ? '' : exam.plan, ph: t('استراحت، مایعات، کنترل مجدد...') });
    fields.push({ k: 'notes', label: t('یادداشت محرمانه داکتر'), type: 'textarea', rows: 2, val: isNew ? '' : exam.doctorNotes });
  } else {
    fields.push({ k: 'info', label: '', type: 'static', html: '<div class="hint">' + ic('info') + ' ' + t('تشخیص و برنامه درمان فقط توسط داکتر ثبت و تأیید می‌شود') + '</div>' });
  }
  const v = await UI.form(fields, {
    title: isNew ? t('ثبت معاینه جدید') : t('ویرایش معاینه'),
    values: isNew ? {} : { complaint: exam.complaint, symptoms: exam.symptoms }, submit: t('ذخیره معاینه')
  });
  if (!v) return;
  const nv = {
    patientId, date: v.date, apptId: isNew ? (prefill.apptId || null) : exam.apptId,
    complaint: v.complaint.trim(), symptoms: v.symptoms.trim(),
    vitals: {}, diagnosis: canSeeMedical() ? v.diagnosis.trim() : (exam ? exam.diagnosis : ''),
    plan: canSeeMedical() ? v.plan.trim() : (exam ? exam.plan : ''),
    doctorNotes: canSeeMedical() ? v.notes.trim() : (exam ? exam.doctorNotes : '')
  };
  VITAL_FIELDS.forEach(([k]) => { if (v['v_' + k]) nv.vitals[k] = v['v_' + k].trim(); });
  if (isNew) {
    const rec = Object.assign({
      id: uid(), time: nowTime(), confirmed: false, confirmedAt: null, doctorId: null, doctorName: '',
      createdById: session.user.id, createdByName: session.user.name, history: [], deleted: false, createdAt: nowFull()
    }, nv);
    rec.doctorName = isDoctor() ? session.user.name : '';
    if (isDoctor()) {
      rec.confirmed = await UI.confirm(t('تشخیص به‌صورت نهایی تأیید و ثبت شود؟') + '<br><small class="text-dim">' + t('در صورت انصراف، معاینه به‌صورت موقت ذخیره می‌شود') + '</small>', { title: t('تأیید نهایی تشخیص'), yes: t('بلی — تأیید نهایی') });
      if (rec.confirmed) { rec.confirmedAt = nowFull(); rec.doctorId = session.user.id; rec.doctorName = session.user.name; }
    }
    await DB.put('exams', rec);
    await Audit.log('create', 'exams', rec.id, pName(await DB.get('patients', patientId)));
    if (rec.apptId) {
      const ap = await DB.get('appointments', rec.apptId);
      if (ap) { ap.status = 'done'; await DB.put('appointments', ap); }
    }
    UI.toast(rec.confirmed ? t('معاینه ثبت و تأیید شد') : t('معاینه موقتاً ذخیره شد — تشخیص توسط داکتر تأیید شود'), 'ok', 4000);
    go('exams', rec.id);
  } else {
    const changes = {};
    ['complaint','symptoms','diagnosis','plan','date'].forEach(k => {
      if (String(exam[k] || '') !== String(nv[k] || '')) changes[k] = [exam[k], nv[k]];
    });
    Object.keys(nv.vitals).concat(Object.keys(exam.vitals || {})).forEach(k => {
      if ((exam.vitals || {})[k] !== nv.vitals[k]) changes['vitals.' + k] = [(exam.vitals || {})[k], nv.vitals[k]];
    });
    exam.history = exam.history || [];
    exam.history.push({ ts: nowFull(), userId: session.user.id, userName: session.user.name, reason: reason || t('ویرایش عادی'), changes });
    Object.assign(exam, nv);
    exam.editedAt = nowFull(); exam.editedBy = session.user.name;
    await DB.put('exams', exam);
    await Audit.log(reason ? 'edit-confirmed' : 'edit', 'exams', exam.id, Object.keys(changes).join(', '), reason);
    UI.toast(t('معاینه به‌روز شد (تاریخچه حفظ شد)'), 'ok');
    Pages.examDetail(document.getElementById('view'), exam.id);
  }
}
Pages.examDetail = async function (view, id) {

    '<div class="ph-sub">' + fmtJG(e.date) + ' ' + fa(e.time || '') + ' — ' + t('داکتر') + ': <b>' + esc(e.doctorName || (e.createdByName || '—')) + '</b> — ' + esc(p.fileNo) + '</div></div>' +
    (can('exams', 'e') && (!e.confirmed || isDoctor()) ? '<button class="btn ghost" data-edit>' + ic('edit') + t('ویرایش') + '</button>' : '') +
    (!e.confirmed && isDoctor() ? '<button class="btn primary" data-confirm>' + ic('check') + t('تأیید نهایی تشخیص') + '</button>' : '') +
    (isDoctor() && e.confirmed ? '<button class="btn primary" data-rxnew>' + ic('clipboard') + t('نسخه جدید') + '</button>' : '') +
    (can('exams', 'p') ? '<button class="btn ghost" data-print>' + ic('printer') + t('چاپ') + '</button>' : '') +
    '</div>' +
    (e.confirmed ? '<span class="badge b-green">' + ic('check') + ' ' + t('تشخیص نهایی تأییدشده داکتر') + '</span>' :
      '<span class="badge b-amber">' + t('تأیید نشده — تشخیص قطعی نیست') + '</span>') +
    '<div class="card" style="margin-top:12px"><h3>' + ic('activity') + t('علایم حیاتی') + '</h3>' +
    (vitHtml ? '<div class="vitals">' + vitHtml + '</div>' : '<span class="text-dim fs-s">' + t('علایم حیاتی ثبت نشده') + '</span>') +
    (bmi ? '<div class="hint" style="margin-top:8px">' + t('شاخص توده بدنی (BMI)') + ': <b>' + fa(bmi) + '</b></div>' : '') +
    (prev ? '<div class="hint" style="margin-top:4px">' + t('مقایسه با معاینه قبلی') + ' (' + fmtJ(prev.date) + ') — ▲▼ ' + t('تغییر نسبت به قبل') + '</div>' : '') +
    '</div>' +
    '<div class="grid two" style="margin-top:14px">' +
    '<div class="card tight"><h3>' + ic('steth') + t('شکایت و علایم') + '</h3><div class="fs-s" style="line-height:2">' +
      '<p><b>' + t('شکایت اصلی') + ':</b> ' + esc(e.complaint || '—') + '</p>' +
      '<p><b>' + t('علایم و سابقه') + ':</b> ' + esc(e.symptoms || '—') + '</p></div></div>' +

<script>
/* ==================== prescriptions ==================== */
Routes.prescriptions = { mod: 'prescriptions', title: 'نسخه‌ها', render: (...a) => Pages.prescriptions(...a) };
let rxQ = '', rxF = '';
const FREQ_OPTS = [
  ['1x', 'روزی ۱ بار'], ['2x', 'روزی ۲ بار'], ['3x', 'روزی ۳ بار'], ['4x', 'روزی ۴ بار'],
  ['hs', 'شب قبل از خواب'], ['qod', 'یک روز در میان'], ['prn', 'در صورت نیاز']

const METHOD_OPTS = [
  ['after', 'بعد از غذابا آب کافی'], ['before', 'قبل از غذا'], ['with', 'همراه با غذا'],
  ['empty', 'با معده خالی'], ['topical', 'موضعی'], ['eye', 'قطره چشمی'], ['inj', 'تزریقی'], ['other', 'سایر']
];
const FREQ_L = k => { const f = FREQ_OPTS.find(x => x[0] === k); return f ? f[1] : k; };
const METHOD_L = k => { const f = METHOD_OPTS.find(x => x[0] === k); return f ? f[1] : k; };
function rxStatusBadge(r) {

}
const rxTotal = r => sum(r.items || [], i => num(i.qty) * num(i.unitPrice || 0));
Pages.prescriptions = async function (view, param) {
  if (param) return Pages.rxDetail(view, param);

  let list = rxs;
  const q = rxQ.trim().toLowerCase();

  if (rxF) list = list.filter(r => r.status === rxF);
  list.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const rows = list.slice(0, 200).map(r => ({
    attr: 'data-open="' + r.id + '" style="cursor:pointer"',

  view.innerHTML =
    '<div class="page-head"><h2>' + t('نسخه‌نویسی') + '</h2><div class="grow"></div>' +
    (isDoctor() ? '<button class="btn primary" data-new>' + ic('plus') + t('نسخه جدید') + '</button>' : '') + '</div>' +
    '<div class="toolbar">' +
      '<div class="searchbox">' + ic('search') + '<input class="input" id="rxQ" placeholder="' + t('جستجو: مریض یا شماره نسخه') + '" value="' + esc(rxQ) + '"></div>' +
      '<select class="input select" id="rxF" style="width:auto">' +
        '<option value="">' + t('همه وضعیت‌ها') + '</option>' +
        '<option value="draft"' + (rxF === 'draft' ? ' selected' : '') + '>' + t('تأیید نشده') + '</option>' +
        '<option value="confirmed"' + (rxF === 'confirmed' ? ' selected' : '') + '>' + t('در انتظار تحویل') + '</option>' +
        '<option value="dispensed"' + (rxF === 'dispensed' ? ' selected' : '') + '>' + t('تحویل‌شده') + '</option>' +
      '</select>' +
    '</div>' + tableEl(
      [{ h: t('شماره نسخه') }, { h: t('مریض') }, { h: t('دواها') }, { h: t('مبلغ') }, { h: t('داکتر') }, { h: t('وضعیت') }, { h: '' }],
      rows, { empty: t('نسخه‌ای ثبت نشده'), emptySub: isDoctor() ? t('با دکمه «نسخه جدید» یا از داخل معاینه نسخه بنویسید') : '' });
  view.querySelectorAll('[data-open]').forEach(tr => tr.onclick = e => { if (!e.target.closest('button')) go('prescriptions', tr.dataset.open); });

function rxActions(r) {

    h += '<button class="iconbtn" data-act="confirm" data-id="' + r.id + '" title="' + t('تأیید نهایی') + '">' + ic('check') + '</button>';
  if (isDoctor() && !r.dispensed)
    h += '<button class="iconbtn" data-act="del" data-id="' + r.id + '">' + ic('trash') + '</button>';
  return h;
}
async function rxAction(act, id) {
  const r = await DB.get('prescriptions', id);
  if (!r) return;
  if (act === 'open') go('prescriptions', id);
  if (act === 'print') printRx(r);
  if (act === 'edit') openRxForm(r, null).then(() => { if (parseHash().param) Pages.rxDetail(document.getElementById('view'), id); else Pages.prescriptions(document.getElementById('view')); });
  if (act === 'confirm') {
    r.confirmed = true; r.status = 'confirmed'; r.confirmedAt = nowFull(); r.confirmedBy = session.user.name;
    await DB.put('prescriptions', r);
    await Audit.log('confirm', 'prescriptions', id, r.rxNo);

    Pages.prescriptions(document.getElementById('view'));
  }

    r.deleted = true;

    await Audit.log('delete', 'prescriptions', id, r.rxNo);

async function openRxForm(rx, prefill) {
  prefill = prefill || {};
  const isNew = !rx;
  if (!isDoctor()) { UI.toast(t('نسخه فقط توسط داکتر ثبت می‌شود'), 'warn'); return; }
  let patientId = isNew ? (prefill.patientId || null) : rx.patientId;
  if (!patientId) {
    const pts = (await DB.all('patients')).filter(p => !p.deleted);
    if (!pts.length) { UI.toast(t('اول یک مریض ثبت کنید'), 'warn'); return; }
    const v = await UI.picker(pts.map(p => ({ v: p.id, l: pName(p), sub: p.fileNo })), { title: t('انتخاب مریض برای نسخه') });

    body: '<div id="rxItems"></div>' +

      '<div class="hint" style="margin-top:8px">' + ic('info') + ' ' + t('پس از ثبت، نسخه باید توسط داکتر تأیید شود تا به داروخانه ارسال گردد') + '</div>',
    foot: '<button class="btn ghost" data-cancel2>' + t('انصراف') + '</button><button class="btn primary" data-saverx>' + (isNew ? t('ثبت نسخه') : t('ذخیره تغییرات')) + '</button>',
    onClose: () => {}
  });
  m.el.querySelector('[data-cancel2]').onclick = () => m.close();
  const itemRow = (it, idx) => {
    const drugOpts = '<option value="">— ' + t('انتخاب از داروخانه') + ' —</option>' + drugs.map(d =>
      '<option value="' + d.id + '"' + (it.drugId === d.id ? ' selected' : '') + '>' + esc(d.name) + ' (' + fa(d.qty) + ')</option>').join('');
    return '<div class="rx-item" data-idx="' + idx + '">' +
      '<div style="flex:2;min-width:140px"><label class="fs-xs text-dim">' + t('دوا') + '</label>' +

      '<input class="input" data-f="name" placeholder="' + t('یا نام دستی دوا') + '" value="' + esc(it.name || '') + '" style="margin-top:5px"></div>' +
      '<div style="flex:1;min-width:90px"><label class="fs-xs text-dim">' + t('دوز / مقدار') + '</label><input class="input" data-f="dose" placeholder="500mg، 1 قرص" value="' + esc(it.dose || '') + '"></div>' +
      '<div style="flex:1;min-width:110px"><label class="fs-xs text-dim">' + t('تکرار مصرف') + '</label><select class="input select" data-f="freq">' +

      '<div style="flex:1;min-width:80px"><label class="fs-xs text-dim">' + t('مدت (روز)') + '</label><input class="input" data-f="days" value="' + esc(it.days || '') + '"></div>' +

      '<div style="flex:1.4;min-width:120px"><label class="fs-xs text-dim">' + t('توضیح') + '</label><input class="input" data-f="note" value="' + esc(it.note || '') + '"></div>' +

  };
  const renderItems = () => {

<script>
/* ==================== financial core (transactions & debts) ==================== */
const Trx_SRC_L = { service:'خدمات مطب', pharmacy:'داروخانه', lab:'لابراتوار', other:'سایر عواید',
  purchase:'خرید موجودی', refund:'برگشت فروش', 'expense-generic':'مصارف عمومی', 'supplier-pay':'پرداخت به تأمین‌کننده',
  'manual-in':'دریافت دستی', 'manual-out':'پرداخت دستی', opening:'افتتاحیه' };
const Inv_SRC = ['purchase']; /* تراکنش‌های مرتبط با موجودی — از مصارف عملیاتی جدا محاسبه می‌شوند */
async function addTrx(o) {
  /* o: {type:'income'|'expense', source, amount, method:'cash'|'bank', note, patientId, refType, refId, inv} */
  if (o.refType && o.refId) {
    const all = await DB.all('transactions');
    if (all.some(x => x.refType === o.refType && x.refId === o.refId && !x.voided)) return null; /* جلوگیری از ثبت دوباره */
  }
  const no = 'TR-' + jOf(nowISO()).jy + '-' + (await nextCounter('trxNo'));
  const rec = {
    id: uid(), no, date: nowISO(), jmonth: monthKey(nowISO()), time: nowTime(),
    type: o.type, source: o.source || 'other', amount: num(o.amount), method: o.method || 'cash',
    note: o.note || '', patientId: o.patientId || null, refType: o.refType || null, refId: o.refId || null,
    inv: !!o.inv, userId: session.user.id, userName: session.user.name, createdAt: nowFull(), voided: false
  };
  await DB.put('transactions', rec);
  await Audit.log(o.type === 'income' ? 'receive' : 'pay', 'accounting', rec.id, rec.no + ' — ' + money(rec.amount));
  return rec;
}
async function cashBalances() {
  const trxs = (await DB.all('transactions')).filter(x => !x.voided);
  const bal = { cash: num(S.cashStart), bank: num(S.bankStart) };
  trxs.forEach(x => {
    const m = x.method === 'bank' ? 'bank' : 'cash';
    if (x.type === 'income') bal[m] += num(x.amount);
    else bal[m] -= num(x.amount);
  });
  return bal;
}
async function createDebt(o) {
  /* o: {partyType:'patient'|'supplier', partyId, partyName, amount, label, refType, refId} */
  const all = await DB.all('debts');
  let d = all.find(x => x.partyType === o.partyType && x.partyId === o.partyId && x.status === 'open');
  if (!d) {
    d = { id: uid(), partyType: o.partyType, partyId: o.partyId, partyName: o.partyName,
      amount: 0, paid: 0, items: [], payments: [], status: 'open', createdAt: nowFull() };
  }
  d.items.push({ label: o.label, amount: num(o.amount), date: nowISO(), refType: o.refType || null, refId: o.refId || null });
  d.amount += num(o.amount);
  await DB.put('debts', d);
  await Audit.log('create', 'accounting', d.id, (o.partyType === 'patient' ? t('بدهی مریض') : t('طلب تأمین‌کننده')) + ' ' + o.partyName + ': ' + money(o.amount));
  return d;
}
async function payDebt(debt, amount, method, note) {
  amount = num(amount);
  if (amount <= 0) throw new Error(t('مبلغ نامعتبر است'));
  const trx = await addTrx({
    type: debt.partyType === 'patient' ? 'income' : 'expense',
    source: debt.partyType === 'patient' ? (debt.items[0] && debt.items[0].refType === 'rx' ? 'pharmacy' : 'service') : 'supplier-pay',
    amount, method,
    note: (note || t('تسویه بدهی')) + ' — ' + debt.partyName,
    refType: 'debt-pay', refId: uid(), patientId: debt.partyType === 'patient' ? debt.partyId : null
  });
  debt.paid += amount;
  debt.payments.push({ date: nowISO(), amount, method, trxId: trx ? trx.id : null, by: session.user.name, note: note || '' });
  if (debt.paid >= debt.amount - 0.01) debt.status = 'settled';
  await DB.put('debts', debt);
  await Audit.log('pay', 'accounting', debt.id, money(amount) + ' — ' + debt.partyName);
  return trx;
}

/* ==================== pharmacy ==================== */
Routes.pharmacy = { mod: 'pharmacy', title: 'داروخانه', render: (...a) => Pages.pharmacy(...a) };
let pharmTab = 'stock', pharmQ = '', saleQ = '';
function drugStatus(d) {
  const today = nowISO();
  if (d.expiry && d.expiry < today) return ['b-red', t('منقضی')];
  if (d.expiry && d.expiry <= addDays(today, 60)) return ['b-amber', t('نزدیک انقضا')];
  if (num(d.qty) <= 0) return ['b-red', t('تمام‌شده')];
  if (num(d.qty) <= num(d.minQty || 0)) return ['b-amber', t('کم‌موجود')];
  return ['b-green', t('موجود')];
}
Pages.pharmacy = async function (view, param) {
  const tabs = [['stock', t('موجودی دواها')], ['queue', t('نسخه‌های در انتظار')], ['sales', t('فروش‌ها')], ['purchase', t('خرید و تأمین')], ['report', t('گزارش سود داروخانه')]];
  if (pharmTab === 'sale-new') pharmTab = 'stock';
  view.innerHTML =
    '<div class="page-head"><h2>' + t('مدیریت داروخانه') + '</h2><div class="grow"></div>' +
    (can('pharmacy', 'c') ? '<button class="btn primary" data-newdrug>' + ic('plus') + t('دوای جدید') + '</button>' +
      '<button class="btn ghost" data-newsale>' + ic('wallet') + t('فروش جدید') + '</button>' +
      '<button class="btn ghost" data-newbuy>' + ic('box') + t('خرید موجودی') + '</button>' : '') + '</div>' +
    '<div class="tabs">' + tabs.map(([k, l]) => '<button class="tab ' + (pharmTab === k ? 'active' : '') + '" data-ptab="' + k + '">' + esc(l) + '</button>').join('') + '</div>' +
    '<div id="pharmBody">' + ic('clock') + '</div>';
  view.querySelectorAll('[data-ptab]').forEach(b => b.onclick = () => { pharmTab = b.dataset.ptab; Pages.pharmacy(view); });
  const nb = view.querySelector('[data-newdrug]');
  if (nb) nb.onclick = () => openDrugForm(null).then(() => Pages.pharmacy(view));
  const ns = view.querySelector('[data-newsale]');
  if (ns) ns.onclick = () => openSaleForm(null).then(() => Pages.pharmacy(view));
  const np = view.querySelector('[data-newbuy]');
  if (np) np.onclick = () => openPurchaseForm().then(() => Pages.pharmacy(view));
  const body = document.getElementById('pharmBody');
  if (pharmTab === 'stock') await pharmStock(body);
  else if (pharmTab === 'queue') await pharmQueue(body);
  else if (pharmTab === 'sales') await pharmSales(body);
  else if (pharmTab === 'purchase') await pharmPurchases(body);
  else if (pharmTab === 'report') await pharmReport(body);
};
async function pharmStock(body) {

          { v: '<b class="num">' + fa(d.qty) + '</b>' + (num(d.minQty) ? '<br><small class="text-dim">' + t('حداقل') + ': ' + fa(d.minQty) + '</small>' : '') },
          { v: '<span class="num">' + money(d.buyPrice) + '</span>' },

          { v: d.batch ? '<span class="fs-xs num ltr">' + esc(d.batch) + '</span><br>' : '' + (d.expiry ? '<span class="num fs-s">' + fmtJ(d.expiry) + '</span>' : '—') },
          { v: '<span class="badge ' + bc + '">' + bl + '</span>' },

  body.querySelectorAll('[data-act]').forEach(b => b.onclick = () => drugAction(b.dataset.act, b.dataset.id));

async function drugAction(act, id) {
  const d = await DB.get('drugs', id);

    d.deleted = true; d.deletedAt = nowFull();

      { k: 'qty', label: t('موجودی جدید (تعداد واقعی شمارش‌شده)'), type: 'number', req: true, val: d.qty },

    foot: '<button class="btn ghost" data-sc>' + t('انصراف') + '</button><button class="btn primary" data-ssave>' + ic('save') + t('ثبت فروش و کسر موجودی') + '</button>',
    onClose: () => {}
  });
  m.el.querySelector('[data-sc]').onclick = () => m.close();
  const rowHtml = (it, idx) => {
    const drugOpts = '<option value="">— ' + t('انتخاب دوا') + ' —</option>' + drugs.map(d =>
      '<option value="' + d.id + '"' + (it.drugId === d.id ? ' selected' : '') + '>' + esc(d.name) + ' — ' + t('موجودی') + ': ' + fa(d.qty) + '</option>').join('');
    return '<div class="rx-item" data-idx="' + idx + '">' +
      '<div style="flex:2.2;min-width:170px"><select class="input select" data-sf="drugId">' + drugOpts + '</select>' +
      '<div class="hint" data-stockwarn></div></div>' +
      '<div style="flex:1;min-width:70px"><label class="fs-xs text-dim">' + t('تعداد') + '</label><input class="input" type="number" min="1" data-sf="qty" value="' + esc(it.qty || 1) + '"></div>' +
      '<div style="flex:1;min-width:90px"><label class="fs-xs text-dim">' + t('قیمت واحد (؋)') + '</label><input class="input" type="number" min="0" data-sf="unitPrice" value="' + esc(it.unitPrice || 0) + '"></div>' +
      '<div style="flex:1;min-width:90px;text-align:center"><label class="fs-xs text-dim">' + t('مجموع') + '</label><b class="num" data-line="tot">' + money((it.qty || 0) * (it.unitPrice || 0)) + '</b></div>' +
      '<button class="iconbtn" data-rmsi="' + idx + '">' + ic('trash') + '</button></div>';
  };
  const calc = () => {
    let tot = 0;
    m.el.querySelectorAll('.rx-item').forEach(row => {
      const i = +row.dataset.idx;
      const it = items[i];
      tot += num(it.qty) * num(it.unitPrice);
      row.querySelector('[data-line=tot]').textContent = money(num(it.qty) * num(it.unitPrice));
      const d = drugs.find(x => x.id === it.drugId);
      const w = row.querySelector('[data-stockwarn]');
      if (d) {
        it.buyPrice = num(d.buyPrice);
        if (num(it.qty) > num(d.qty)) { w.textContent = '⚠ ' + t('موجودی کافی نیست') + ' (' + fa(d.qty) + ')'; w.style.color = 'var(--bad)'; }
        else { w.textContent = t('موجودی') + ': ' + fa(d.qty); w.style.color = 'var(--ink3)'; }
      } else w.textContent = '';
    });
    const disc = num(m.el.querySelector('#sDiscount').value);
    m.el.querySelector('#sTotal').textContent = money(Math.max(0, tot - disc));
    return { tot, disc };
  };
  const renderItems = () => {
    m.el.querySelector('#saleItems').innerHTML = items.map((it, i) => rowHtml(it, i)).join('') ||
      '<div class="empty">' + ic('pill') + '<b>' + t('جنسی افزوده نشده') + '</b></div>';
    m.el.querySelectorAll('[data-rmsi]').forEach(b => b.onclick = () => { items.splice(+b.dataset.rmsi, 1); renderItems(); calc(); });
    m.el.querySelectorAll('.rx-item').forEach(row => {
      row.querySelectorAll('[data-sf]').forEach(inp => {
        inp.onchange = inp.oninput = () => {
          const it = items[+row.dataset.idx];
          if (inp.dataset.sf === 'drugId') {
            const d = drugs.find(x => x.id === inp.value);
            if (d) { it.unitPrice = num(d.sellPrice); row.querySelector('[data-sf=unitPrice]').value = it.unitPrice; }
            it.buyPrice = d ? num(d.buyPrice) : 0;
          }
          it[inp.dataset.sf] = inp.dataset.sf === 'drugId' ? inp.value : num(inp.value);
          calc();
        };
      });
    });
    calc();
  };
  m.el.querySelector('[data-addsi]').onclick = () => { items.push({ drugId: '', name: '', qty: 1, unitPrice: 0, buyPrice: 0 }); renderItems(); };
  renderItems();
  if (!items.length) m.el.querySelector('[data-addsi]').click();
  m.el.querySelector('#sDiscount').oninput = calc;
  m.el.querySelector('[data-ssave]').onclick = async () => {
    const clean = items.filter(i => i.drugId && num(i.qty) > 0);
    if (!clean.length) { UI.toast(t('حداقل یک جنس با دوا و تعداد انتخاب کنید'), 'bad'); return; }
    for (const i of clean) {
      const d = drugs.find(x => x.id === i.drugId);
      if (num(i.qty) > num(d.qty)) { UI.toast(t('موجودی') + ' «' + d.name + '» ' + t('کافی نیست'), 'bad'); return; }
    }
    const { tot, disc } = calc();
    const total = Math.max(0, tot - disc);
    const pay = m.el.querySelector('#sPay').value;
    if (pay === 'credit' && !patientId) { UI.toast(t('برای فروش نسیه، انتخاب مریض ضروری است'), 'bad'); return; }
    const no = await nextCounter('saleNo');
    const rec = {
      id: uid(), saleNo: 'S-' + no, date: nowISO(), time: nowTime(),
      patientId: patientId || null, prescriptionId: rx ? rx.id : null, rxNo: rx ? rx.rxNo : null,
      items: clean.map(i => ({ drugId: i.drugId, name: i.name || (drugs.find(x => x.id === i.drugId) || {}).name || '', qty: num(i.qty), unitPrice: num(i.unitPrice), buyPrice: num(i.buyPrice) })),
      subtotal: tot, discount: disc, total,
      paymentType: pay, createdBy: session.user.name, userId: session.user.id,
      createdAt: nowFull(), returns: null
    };
    for (const i of rec.items) {
      const d = await DB.get('drugs', i.drugId);
      d.qty = num(d.qty) - num(i.qty);
      await DB.put('drugs', d);
    }
    await DB.put('drugSales', rec);
    if (pay === 'cash') {
      await addTrx({ type: 'income', source: 'pharmacy', amount: total, method: 'cash', note: t('فروش داروخانه') + ' ' + rec.saleNo, refType: 'sale', refId: rec.id, patientId });
    } else {
      await createDebt({ partyType: 'patient', partyId: patientId, partyName: pName(await DB.get('patients', patientId)), amount: total, label: t('فروش نسیه داروخانه') + ' ' + rec.saleNo, refType: 'sale', refId: rec.id });
    }
    if (rx) {
      rx.dispensed = true; rx.status = 'dispensed'; rx.dispensedAt = nowFull(); rx.dispensedBy = session.user.name; rx.saleId = rec.id;
      await DB.put('prescriptions', rx);
      await Audit.log('dispense', 'pharmacy', rx.id, rx.rxNo);
    }
    await Audit.log('sale', 'pharmacy', rec.id, rec.saleNo + ' — ' + money(total));
    m.close();
    UI.toast(t('فروش ثبت شد و موجودی کسر گردید') + ' — ' + money(total), 'ok', 4000);
    const pr = await UI.confirm(t('چاپ رسید فروش اکنون انجام شود؟'), { yes: t('بلی، چاپ رسید') });
    if (pr) printSaleReceipt(rec);
  };
}
async function openSaleReturn(saleId) {
  const s = await DB.get('drugSales', saleId);
  if (!s) return;
  const reason = await UI.askReason(t('دلیل برگشت جنس — الزامی است'), true);
  if (!reason) return;
  const m = UI.modal({
    title: t('برگشت جنس — رسید') + ' ' + esc(s.saleNo), wide: true,
    body: '<div class="fs-s text-dim" style="margin-bottom:8px">' + t('مقدار برگشتی هر جنس را وارد کنید (بیشتر از مقدار فروخته‌شده نیست)') + '</div>' +
      (s.items || []).map((i, x) => '<div class="rx-item"><div class="grow"><b>' + esc(i.name) + '</b><small>' + t('فروخته‌شده') + ': ' + fa(i.qty) + ' — ' + money(i.unitPrice) + '</small></div>' +
      '<input class="input" type="number" min="0" max="' + i.qty + '" value="0" data-retqty="' + x + '" style="max-width:90px"></div>').join(''),
    foot: '<button class="btn ghost" data-rc>' + t('انصراف') + '</button><button class="btn bad" data-rs>' + ic('refresh') + t('ثبت برگشت') + '</button>',
    onClose: () => {}
  });
  m.el.querySelector('[data-rc]').onclick = () => m.close();
  m.el.querySelector('[data-rs]').onclick = async () => {
    const retItems = [];
    for (let x = 0; x < (s.items || []).length; x++) {
      const q = num(m.el.querySelector('[data-retqty="' + x + '"]').value);
      if (q > 0) retItems.push({ drugId: s.items[x].drugId, name: s.items[x].name, qty: q, unitPrice: num(s.items[x].unitPrice) });
    }
    if (!retItems.length) { UI.toast(t('مقدار برگشتی انتخاب نشده'), 'warn'); return; }
    const refund = sum(retItems, i => i.qty * i.unitPrice);
    for (const i of retItems) {
      const d = await DB.get('drugs', i.drugId);
      if (d) { d.qty = num(d.qty) + num(i.qty); await DB.put('drugs', d); }
    }
    s.returns = s.returns || [];
    s.returns.push({ date: nowISO(), items: retItems, total: refund, reason, by: session.user.name });
    await DB.put('drugSales', s);
    if (s.paymentType === 'cash') {
      await addTrx({ type: 'expense', source: 'refund', amount: refund, method: 'cash', note: t('برگشت فروش') + ' ' + s.saleNo, refType: 'sale-return', refId: uid(), inv: false });
    } else if (s.patientId) {
      const ds = (await DB.all('debts')).filter(d => d.partyType === 'patient' && d.partyId === s.patientId && d.status === 'open');
      const d0 = ds.sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0];
      if (d0) {
        d0.amount = Math.max(0, d0.amount - refund);
        d0.items.push({ label: t('برگشت جنس') + ' ' + s.saleNo + ' (' + reason + ')', amount: -refund, date: nowISO() });
        if (d0.paid >= d0.amount - 0.01 && d0.amount > 0) d0.status = 'settled';
        if (d0.amount === 0 && d0.paid === 0) d0.status = 'settled';
        await DB.put('debts', d0);
      }
    }
    await Audit.log('sale-return', 'pharmacy', s.id, money(refund) + ' — ' + retItems.map(i => i.name).join('، '), reason);
    m.close();
    UI.toast(t('برگشت ثبت شد — مبلغ') + ': ' + money(refund), 'ok', 4000);
    Pages.pharmacy(document.getElementById('view'));
  };
}

async function pharmReport(body) {
  const sales = (await DB.all('drugSales')).filter(s => !s.deleted);
  const today = nowISO();
  const mk = monthKey(today);
  const monthSales = sales.filter(s => monthKey(s.date) === mk);
  const rev = sum(monthSales, s => s.total);
  const rets = sum(monthSales, s => sum(s.returns || [], r => r.total));
  const cogs = sum(monthSales, s => sum(s.items || [], i => num(i.qty) * num(i.buyPrice)));
  const profit = rev - rets - cogs;
  const byDrug = {};
  monthSales.forEach(s => (s.items || []).forEach(i => {
    const k = i.name;
    byDrug[k] = byDrug[k] || { qty: 0, rev: 0, cogs: 0 };
    byDrug[k].qty += num(i.qty); byDrug[k].rev += num(i.qty) * num(i.unitPrice); byDrug[k].cogs += num(i.qty) * num(i.buyPrice);
  }));
  const tops = Object.entries(byDrug).sort((a, b) => b[1].rev - a[1].rev).slice(0, 12);
  body.innerHTML =
    '<div class="grid">' +
    statCard('wallet', 'ic-green', money(rev), t('فروش این ماه'), monthLabel(jOf(today).jy, jOf(today).jm)) +
    statCard('box', 'ic-rose', money(cogs), t('بهای تمام‌شده جنس (COGS)')) +
    statCard('refresh', 'ic-amber', money(rets), t('برگشتی‌ها')) +
    statCard('chart', profit >= 0 ? 'ic-indigo' : 'ic-rose', money(profit), t('سود خالص داروخانه')) + '</div>' +

<script>
/* ==================== lab ==================== */
Routes.lab = { mod: 'lab', title: 'لابراتوار', render: (...a) => Pages.lab(...a) };
let labTab = 'requests', labF = '';
function labStatusBadge(st) {
  const m = {
    requested: ['b-gray', 'ثبت‌شده — در انتظار نمونه'], sampled: ['b-blue', 'نمونه‌گیری شد'],
    processing: ['b-amber', 'در حال آزمایش'], completed: ['b-violet', 'نتیجه ثبت شد — در انتظار تأیید'],
    verified: ['b-green', 'تأییدشده'], cancelled: ['b-red', 'لغوشده']
  };
  const [c, l] = m[st] || m.requested;
  return '<span class="badge ' + c + '">' + t(l) + '</span>';
}
/* shared billing helper */
async function billPatient(o) {
  /* o: {patientId, source, items:[{label,amount}], refType, refId, title, note} */
  const total = sum(o.items || [], i => i.amount);
  if (!total) return;
  const p = o.patientId ? await DB.get('patients', o.patientId) : null;
  const v = await UI.form([
    { k: 'sum', label: t('اقلام صورت‌حساب'), type: 'static', html: (o.items || []).map(i =>
      '<div class="kv"><b>' + esc(i.label) + '</b><span class="num">' + money(i.amount) + '</span></div>').join('') +
      '<div class="kv" style="font-weight:800"><b>' + t('مجموع') + '</b><span class="num">' + money(total) + '</span></div>' },
    { k: 'method', label: t('روش پرداخت'), type: 'select', options: [{ v: 'cash', l: t('نقدی') }, { v: 'bank', l: t('بانکی') }], half: true },
    { k: 'paid', label: t('مبلغ دریافت‌شده (؋)'), type: 'number', val: total, half: true },
    { k: 'note', label: t('توضیح'), half: true }
  ], { title: o.title || t('دریافت عواید — ') + (p ? pName(p) : ''), submit: t('ثبت دریافت') });
  if (!v) return false;
  const paid = Math.min(num(v.paid), total);
  const trx = await addTrx({
    type: 'income', source: o.source, amount: paid, method: v.method,
    note: (o.note || o.items.map(i => i.label).join('، ')), patientId: o.patientId,
    refType: o.refType, refId: o.refId
  });
  if (paid < total && p) {
    await createDebt({ partyType: 'patient', partyId: p.id, partyName: pName(p), amount: total - paid,
      label: (o.note || t('صورت‌حساب')) + ' — ' + t('باقی‌مانده'), refType: o.refType, refId: o.refId });
    UI.toast(t('باقی‌مانده به بدهی مریض اضافه شد') + ': ' + money(total - paid), 'warn', 4500);
  }
  UI.toast(t('دریافت ثبت شد') + ': ' + money(paid), 'ok');
  return true;
}
Pages.lab = async function (view, param) {
  if (param) return Pages.labDetail(view, param);
  const tabs = [['requests', t('درخواست‌های آزمایش')], ['tests', t('انواع آزمایش و تعرفه')], ['report', t('گزارش مالی لابراتوار')]];

    '<div class="page-head"><h2>' + t('مدیریت لابراتوار') + '</h2><div class="grow"></div>' +

    '<div class="tabs">' + tabs.map(([k, l]) => '<button class="tab ' + (labTab === k ? 'active' : '') + '" data-ltab="' + k + '">' + esc(l) + '</button>').join('') + '</div>' +
    '<div id="labBody"></div>';

};

      .map(([k, l]) => '<option value="' + k + '"' + (labF === k ? ' selected' : '') + '>' + esc(t(l)) + '</option>').join('') +

        { v: '<b class="num">' + esc(r.reqNo) + '</b>' },
        { v: fmtJG(r.date) },
        { v: '<b>' + esc(nameOf(r.patientId)) + '</b>' },
        { v: '<span class="fs-s">' + esc((r.testNames || []).join('، ')) + '</span>' },
        { v: '<span class="num">' + money(r.price) + '</span>' },

        { v: (can('lab', 'p') && r.status === 'verified' ? '<button class="iconbtn" data-print="' + r.id + '" title="' + t('چاپ نتیجه') + '">' + ic('printer') + '</button>' : ''), cls: 'acts' }
      ] })), { empty: t('درخواست آزمایشی ثبت نشده'), emptySub: isDoctor() ? t('با دکمه «درخواست آزمایش جدید» برای مریض آزمایش سفارش دهید') : '' });
  body.querySelectorAll('[data-open]').forEach(tr => tr.onclick = e => { if (!e.target.closest('button')) go('lab', tr.dataset.open); });
  body.querySelectorAll('[data-print]').forEach(b => b.onclick = () => DB.get('labRequests', b.dataset.print).then(printLabResult));
  body.querySelector('#labF').onchange = e => { labF = e.target.value; Pages.lab(document.getElementById('view')); };

async function labTests(body) {
  const tests = (await DB.all('labTests')).filter(x => !x.deleted);

        { v: can('lab', 'e') ? '<button class="iconbtn" data-edt="' + x.id + '">' + ic('edit') + '</button>' + (can('lab', 'd') ? '<button class="iconbtn" data-dlt="' + x.id + '">' + ic('trash') + '</button>' : '') : '—', cls: 'acts' }

    { k: 'name', label: t('نام آزمایش'), req: true, half: true },
    { k: 'category', label: t('دسته'), type: 'select', options: S.labCategories, half: true },

    foot: '<button class="btn ghost" data-lc>' + t('انصراف') + '</button><button class="btn primary" data-lsave>' + ic('send') + t('ثبت درخواست و دریافت هزینه') + '</button>',

          '<td class="num fs-s">' + esc(x.normal || '—') + '</td>' +
          '<td><input class="input" data-res="' + x.id + '" data-f="note" value="' + esc(res.note || '') + '" style="min-width:120px"></td></tr>';
      }).join('') + '</table></div>' +
      '<div class="field" style="margin-top:12px"><label>' + t('ضمیمه سند / عکس نتیجه (اختیاری)') + '</label><input type="file" class="input" id="labAtt"></div>',
    foot: '<button class="btn ghost" data-lc>' + t('انصراف') + '</button><button class="btn primary" data-ls>' + ic('save') + t('ذخیره نتایج') + '</button>',
    onClose: () => {}
  });
  m.el.querySelector('[data-lc]').onclick = () => m.close();
  m.el.querySelector('[data-ls]').onclick = async () => {
    r.results = myTests.map(x => {
      const g = f => { const el = m.el.querySelector('[data-res="' + x.id + '"][data-f="' + f + '"]'); return el ? el.value.trim() : ''; };
      return { testId: x.id, name: x.name, value: g('value'), unit: g('unit'), note: g('note') };
    });
    const f = m.el.querySelector('#labAtt');
    if (f.files.length) {
      const att = await saveAttachment(f.files[0], 'lab', r.id, r.patientId);
      r.attachmentId = att.id;
    }
    r.status = 'completed'; r.completedBy = session.user.name; r.completedAt = nowFull();

    await Audit.log('lab-result', 'lab', r.id, r.reqNo);

  };
}
function printLabResult(r) {

      '<table class="pr-tbl"><tr><th>' + t('نام آزمایش') + '</th><th>' + t('نتیجه') + '</th><th>' + t('واحد') + '</th><th>' + t('سنجش مرجع') + '</th><th>' + t('توضیحات') + '</th></tr>' + rows + '</table>' +
      '<div style="display:flex;justify-content:space-between;margin-top:26px" class="pr-sign-row">' +
      '<div class="pr-sign">' + t('متخصص لابراتوار') + '<br><b>' + esc(r.completedBy || '') + '</b></div>' +
      '<div class="pr-sign">' + t('تأیید داکتر') + '<br><b>' + esc(r.verifiedBy || S.doctorName || '') + '</b></div></div>');
  })();
}
async function labReport(body) {
  const [reqs, trxs, purchases] = await Promise.all([DB.all('labRequests'), DB.all('transactions'), DB.all('purchases')]);
  const mk = monthKey(nowISO());
  const monthReqs = reqs.filter(r => !r.deleted && monthKey(r.date) === mk && r.status !== 'cancelled');
  const income = sum(trxs.filter(x => !x.voided && x.source === 'lab' && monthKey(x.date) === mk && x.type === 'income'), x => x.amount);
  const matCost = sum(purchases.filter(p => p.kind === 'lab' && monthKey(p.date) === mk), p => p.total);
  const counts = {};
  monthReqs.forEach(r => (r.testNames || []).forEach(n => counts[n] = (counts[n] || 0) + 1));
  body.innerHTML =
    '<div class="grid">' +
    statCard('wallet', 'ic-green', money(income), t('عواید لابراتوار (این ماه)')) +
    statCard('flask', 'ic-indigo', fa(monthReqs.length), t('تعداد درخواست‌ها'), fa(sum(Object.values(counts))) + ' ' + t('آزمایش انجام‌شده')) +
    statCard('box', 'ic-rose', money(matCost), t('خرید مواد لابراتوار')) +
    statCard('chart', income - matCost >= 0 ? 'ic-sky' : 'ic-rose', money(income - matCost), t('سود لابراتوار')) + '</div>' +
    '<div class="card" style="margin-top:14px"><h3>' + ic('chart') + t('آزمایش‌های این ماه') + '</h3>' +
    tableEl([{ h: t('آزمایش') }, { h: t('تعداد') }], Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([n, c]) =>
      ({ cells: [{ v: esc(n) }, { v: '<b>' + fa(c) + '</b>' }] })), { empty: t('آزمایشی انجام نشده') }) + '</div>';
}

<script>
/* ==================== services & tariffs ==================== */

/* ==================== expenses ==================== */
Routes.expenses = { mod: 'expenses', title: 'مصارف', render: (...a) => Pages.expenses(...a) };
let expFilter = { from: '', to: '', cat: '', q: '' };
Pages.expenses = async function (view) {
  const [expenses, trxs] = await Promise.all([DB.all('expenses'), DB.all('transactions')]);
  const exTrx = trxs.filter(x => !x.voided && x.type === 'expense' && !x.inv);
  const today = nowISO();
  const mk = monthKey(today);
  const jy = jOf(today).jy;
  const daySum = sum(exTrx.filter(x => x.date === today), x => x.amount);
  const monthSum = sum(exTrx.filter(x => monthKey(x.date) === mk), x => x.amount);
  const yearSum = sum(exTrx.filter(x => jOf(x.date).jy === jy), x => x.amount);
  let list = expenses.filter(x => !x.deleted);
  if (expFilter.cat) list = list.filter(x => x.category === expFilter.cat);
  if (expFilter.from) list = list.filter(x => x.date >= expFilter.from);
  if (expFilter.to) list = list.filter(x => x.date <= expFilter.to);
  const q = expFilter.q.trim().toLowerCase();
  if (q) list = list.filter(x => (x.note + ' ' + (x.payee || '')).toLowerCase().includes(q));
  list.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const filteredSum = sum(list, x => num(x.amount) - num(x.paidBefore || 0));
  const recurring = [];
  const seen = {};
  expenses.filter(x => x.recurring && !x.deleted).forEach(x => {
    const key = x.category + '|' + x.payee;
    if (!seen[key]) { seen[key] = 1; recurring.push(x); }
  });
  view.innerHTML =
    '<div class="page-head"><h2>' + t('مدیریت مصارف') + '</h2><div class="grow"></div>' +
    (can('expenses', 'c') ? '<button class="btn primary" data-new>' + ic('plus') + t('ثبت هزینه جدید') + '</button>' : '') +
    (can('expenses', 'p') ? '<button class="btn ghost" data-print>' + ic('printer') + t('چاپ گزارش') + '</button>' : '') + '</div>' +
    '<div class="grid">' +
    statCard('receipt', 'ic-rose', money(daySum), t('مصارف امروز')) +
    statCard('receipt', 'ic-amber', money(monthSum), t('مصارف این ماه'), monthLabel(jOf(today).jy, jOf(today).jm)) +
    statCard('receipt', 'ic-violet', money(yearSum), t('مصارف امسال') + ' (' + fa(jy) + ')') +
    '</div>' +
    (recurring.length ? '<div class="card tight" style="margin-top:14px"><h3>' + ic('refresh') + t('هزینه‌های تکرارشونده (کرایه، معاش و...)') + '</h3><div class="fs-s">' +
      recurring.map(x => '<div class="kv"><span>' + esc(x.category) + (x.payee ? ' — ' + esc(x.payee) : '') + ' — <b class="num">' + money(x.amount) + '</b></span>' +
      '<button class="btn sm ghost" data-recur="' + x.id + '">' + t('ثبت این ماه') + '</button></div>').join('') + '</div>' : '') +
    '<div class="toolbar" style="margin-top:14px">' +
      '<input class="input" type="date" id="expFrom" value="' + esc(expFilter.from) + '" style="width:auto" title="' + t('از تاریخ (میلادی)') + '">' +
      '<input class="input" type="date" id="expTo" value="' + esc(expFilter.to) + '" style="width:auto" title="' + t('تا تاریخ (میلادی)') + '">' +
      '<select class="input select" id="expCat" style="width:auto"><option value="">' + t('همه دسته‌ها') + '</option>' +
      S.expCategories.map(c => '<option value="' + esc(c.name) + '"' + (expFilter.cat === c.name ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select>' +
      '<div class="searchbox">' + ic('search') + '<input class="input" id="expQ" placeholder="' + t('جستجو در شرح و دریافت‌کننده') + '" value="' + esc(expFilter.q) + '"></div>' +
      '<span class="fs-s text-dim">' + t('مجموع نتایج') + ': <b class="num">' + money(filteredSum) + '</b></span>' +
    '</div>' +
    '<div class="hint" style="margin-bottom:10px">' + ic('info') + ' ' + t('خرید دوا و مواد لابراتوار از بخش داروخانه ← «خرید موجودی» ثبت می‌شود تا دوباره‌کاری نشود') + '</div>' +
    '<div id="expList"></div>';
  view.querySelector('[data-new]').onclick = () => openExpenseForm(null).then(() => Pages.expenses(view));
  view.querySelector('[data-print]').onclick = () => printExpenseReport(list);
  view.querySelectorAll('[data-recur]').forEach(b => b.onclick = () => DB.get('expenses', b.dataset.recur).then(x => openExpenseForm(null, x)).then(() => Pages.expenses(view)));
  view.querySelector('#expFrom').onchange = e => { expFilter.from = e.target.value; Pages.expenses(view); };
  view.querySelector('#expTo').onchange = e => { expFilter.to = e.target.value; Pages.expenses(view); };
  view.querySelector('#expCat').onchange = e => { expFilter.cat = e.target.value; Pages.expenses(view); };
  view.querySelector('#expQ').oninput = debounce(e => { expFilter.q = e.target.value; Pages.expenses(view); }, 250);
  const listEl = view.querySelector('#expList');
  listEl.innerHTML = tableEl(
    [{ h: t('تاریخ') }, { h: t('دسته') }, { h: t('شرح') }, { h: t('دریافت‌کننده') }, { h: t('مبلغ') }, { h: t('پرداخت') }, { h: '' }],
    list.slice(0, 150).map(x => ({ cells: [
      { v: fmtJG(x.date) },
      { v: '<span class="badge b-violet">' + esc(x.category) + '</span>' + (x.recurring ? ' <span class="badge b-blue">' + t('تکرارشونده') + '</span>' : '') },
      { v: '<span class="fs-s">' + esc(x.note || '—') + '</span>' },
      { v: esc(x.payee || '—') },
      { v: '<b class="num">' + money(x.amount) + '</b>' },
      { v: x.method ? '<span class="badge ' + (x.method === 'bank' ? 'b-blue' : 'b-green') + '">' + esc(t(PAY_METHOD[x.method])) + '</span>' : '—' },
      { v: expActs(x), cls: 'acts' }
    ] })), { empty: t('هزینه‌ای ثبت نشده') });
  listEl.querySelectorAll('[data-act]').forEach(b => b.onclick = () => expAction(b.dataset.act, b.dataset.id));
};
function expActs(x) {
  let h = '';
  if (x.attachmentId) h += '<button class="iconbtn" data-act="att" data-id="' + x.id + '" title="' + t('سند پیوست') + '">' + ic('clip') + '</button>';
  if (can('expenses', 'e')) h += '<button class="iconbtn" data-act="edit" data-id="' + x.id + '" title="' + t('ویرایش') + '">' + ic('edit') + '</button>';
  if (can('expenses', 'd')) h += '<button class="iconbtn" data-act="del" data-id="' + x.id + '" title="' + t('حذف') + '">' + ic('trash') + '</button>';
  return h || '—';
}
async function expAction(act, id) {
  const x = await DB.get('expenses', id);
  if (!x) return;
  if (act === 'att') return showAttachment(x.attachmentId);
  if (act === 'edit') {
    const reason = await UI.askReason(t('اصلاح هزینه ثبت‌شده — توضیح'), false);
    if (reason === null) return;
    await openExpenseForm(x, null, reason);
    Pages.expenses(document.getElementById('view'));
  }
  if (act === 'del') {
    const reason = await UI.askReason(t('دلیل حذف هزینه — الزامی'), true);
    if (!reason) return;
    x.deleted = true; x.deletedReason = reason; x.deletedAt = nowFull(); x.deletedBy = session.user.name;
    await DB.put('expenses', x);
    await Audit.log('delete', 'expenses', id, x.category + ' ' + money(x.amount), reason);
    UI.toast(t('هزینه حذف شد (با ثبت سابقه)'), 'ok');
    Pages.expenses(document.getElementById('view'));
  }
}
async function openExpenseForm(x, template, editReason) {
  const isNew = !x;
  const isClosed = !isNew && S.closedMonths.includes(monthKey(x.date));
  if (isClosed && !isDoctor() && session.user.role !== 'accountant') {
    UI.toast(t('این تاریخ در دوره مالی بسته‌شده است و قابل تغییر نیست'), 'bad');
    return;
  }
  const v = await UI.form([
    { k: 'category', label: t('دسته هزینه'), type: 'select', options: S.expCategories.map(c => c.name), req: true },
    { k: 'amount', label: t('مبلغ کل (؋)'), type: 'number', min: 0, req: true, half: true },
    { k: 'date', label: t('تاریخ'), type: 'date', val: nowISO(), req: true, half: true },
    { k: 'payee', label: t('شخص یا شرکت دریافت‌کننده'), half: true, ph: t('صاحب خانه، برشنا، کارمند...') },
    { k: 'method', label: t('روش پرداخت'), type: 'select', options: [{ v: 'cash', l: t('نقدی') }, { v: 'bank', l: t('بانکی') }], half: true },
    { k: 'note', label: t('توضیحات'), type: 'textarea', rows: 2 },
    { k: 'paidNow', label: t('مبلغ پرداخت‌شده اکنون (؋) — برای پرداخت قسطی کمتر از کل وارد کنید'), type: 'number', val: template ? template.amount : (x ? x.paidBefore : 0), half: true, hint: t('اگر کمتر از کل باشد، باقی به طلب‌کاری‌ها (پرداخت قسطی) اضافه می‌شود') },
    { k: 'recurring', label: t('هزینه تکرارشونده (ماهانه)'), type: 'check', half: true }
  ], {
    title: isNew ? t('ثبت هزینه جدید') : t('ویرایش هزینه'),
    values: x || {},
    submit: t('ذخیره هزینه')
  });
  if (!v) return;
  const amount = num(v.amount);
  if (amount <= 0) { UI.toast(t('مبلغ نامعتبر است'), 'bad'); return; }
  if (isNew) {
    const paidNow = Math.min(num(v.paidNow), amount);
    const rec = {
      id: uid(), category: v.category, amount, date: v.date, payee: v.payee.trim(), method: v.method,
      note: v.note.trim(), recurring: !!v.recurring, paidBefore: paidNow,
      attachmentId: null, deleted: false, createdBy: session.user.name, userId: session.user.id, createdAt: nowFull()
    };
    const f = v.receipt;
    await DB.put('expenses', rec);
    if (f && f.length) { const att = await saveAttachment(f[0], 'expense', rec.id); rec.attachmentId = att.id; await DB.put('expenses', rec); }
    if (paidNow > 0) {
      await addTrx({ type: 'expense', source: 'expense-generic', amount: paidNow, method: v.method,
        note: x_categoryNote(rec), refType: 'expense', refId: rec.id });
    }
    if (paidNow < amount) {
      await createDebt({ partyType: 'supplier', partyId: rec.payee || 'other-' + rec.id, partyName: rec.payee || t('دریافت‌کننده'),
        amount: amount - paidNow, label: t('باقی‌مانده هزینه') + ': ' + rec.category, refType: 'expense', refId: rec.id });
    }
    await Audit.log('create', 'expenses', rec.id, rec.category + ' — ' + money(amount));
    UI.toast(t('هزینه ثبت شد'), 'ok');
  } else {
    const changes = {};
    ['category','amount','date','payee','method','note','recurring'].forEach(k => {
      const nv = k === 'amount' ? num(v[k]) : (k === 'recurring' ? !!v[k] : (k === 'date' ? v[k] : String(v[k]).trim()));
      if (String(x[k]) !== String(nv)) changes[k] = [x[k], nv];
    });
    Object.keys(changes).forEach(k => x[k] = changes[k][1]);
    x.editedAt = nowFull(); x.editedBy = session.user.name; x.editReason = editReason || '';
    await DB.put('expenses', x);
    await Audit.log(isClosed ? 'edit-confirmed' : 'edit', 'expenses', x.id, Object.keys(changes).join(', '), editReason);
    UI.toast(t('هزینه به‌روز شد'), 'ok');
  }
}
const x_categoryNote = x => t('هزینه') + ': ' + x.category + (x.payee ? ' — ' + x.payee : '') + (x.note ? ' — ' + x.note : '');
function printExpenseReport(list) {
  const total = sum(list, x => x.amount);
  const rows = list.slice(0, 300).map(x => '<tr><td>' + fmtJ(x.date) + '</td><td>' + esc(x.category) + '</td><td>' + esc(x.note || '') + '</td><td>' + esc(x.payee || '') + '</td><td class="num">' + money(x.amount) + '</td><td>' + esc(t(PAY_METHOD[x.method] || '')) + '</td></tr>').join('');
  const byCat = {};
  list.forEach(x => byCat[x.category] = (byCat[x.category] || 0) + num(x.amount));
  Print.doc(t('گزارش مصارف'),
    '<h2 class="pr-h2">' + t('گزارش مصارف مطب') + '</h2>' +

<script>
/* ==================== accounting ==================== */
Routes.accounting = { mod: 'accounting', title: 'حسابداری و صندوق', render: (...a) => Pages.accounting(...a) };
let accTab = 'cash', accFilter = { type: '', source: '', from: '', to: '', q: '' };
async function guardClosed(iso) {
  if (!S.closedMonths.includes(monthKey(iso))) return '';
  if (!isDoctor() && session.user.role !== 'accountant') {
    UI.toast(t('این تاریخ در دوره مالی بسته‌شده است و قابل تغییر نیست'), 'bad');
    return null;
  }
  return await UI.askReason(t('تغییر در دوره مالی بسته‌شده — ثبت دلیل الزامی'), true);
}
Pages.accounting = async function (view) {
  const tabs = [['cash', t('صندوق و تراکنش‌ها')], ['debts', t('بدهی مریضان')], ['payables', t('طلب‌کاری‌ها (تأمین‌کنندگان)')], ['pl', t('سود و زیان')]];
  const bal = await cashBalances();
  view.innerHTML =
    '<div class="page-head"><h2>' + t('حسابداری و صندوق') + '</h2><div class="grow"></div>' +
    (can('accounting', 'c') ? '<button class="btn primary" data-recv>' + ic('download') + t('دریافت جدید') + '</button>' +
      '<button class="btn ghost" data-exp>' + ic('upload') + t('ثبت هزینه') + '</button>' : '') + '</div>' +
    '<div class="grid">' +
    statCard('wallet', 'ic-green', money(bal.cash), t('موجودی صندوق نقدی'), t('افتتاحیه') + ': ' + money(S.cashStart)) +
    statCard('bank', 'ic-sky', money(bal.bank), t('موجودی بانک'), t('افتتاحیه') + ': ' + money(S.bankStart)) +
    '</div>' +
    '<div class="tabs" style="margin-top:14px">' + tabs.map(([k, l]) => '<button class="tab ' + (accTab === k ? 'active' : '') + '" data-atab="' + k + '">' + esc(l) + '</button>').join('') + '</div>' +
    '<div id="accBody"></div>';
  view.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { accTab = b.dataset.atab; Pages.accounting(view); });
  const rv = view.querySelector('[data-recv]');
  if (rv) rv.onclick = () => openReceiveForm().then(() => Pages.accounting(view));
  const ex = view.querySelector('[data-exp]');
  if (ex) ex.onclick = () => { accTab = 'cash'; go('expenses'); };
  const body = document.getElementById('accBody');
  if (accTab === 'cash') await accLedger(body);
  else if (accTab === 'debts') await accDebts(body, 'patient');
  else if (accTab === 'payables') await accDebts(body, 'supplier');
  else await accPL(body);
};
async function accLedger(body) {
  const trxs = (await DB.all('transactions')).filter(x => !x.voided);
  let list = trxs;
  if (accFilter.type) list = list.filter(x => x.type === accFilter.type);
  if (accFilter.source) list = list.filter(x => x.source === accFilter.source);
  if (accFilter.from) list = list.filter(x => x.date >= accFilter.from);
  if (accFilter.to) list = list.filter(x => x.date <= accFilter.to);
  const q = accFilter.q.trim().toLowerCase();
  if (q) list = list.filter(x => (x.note + ' ' + (x.no || '')).toLowerCase().includes(q));
  list.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const inSum = sum(list.filter(x => x.type === 'income'), x => x.amount);
  const outSum = sum(list.filter(x => x.type === 'expense'), x => x.amount);
  body.innerHTML =
    '<div class="toolbar">' +
      '<select class="input select" id="afT" style="width:auto"><option value="">' + t('همه انواع') + '</option>' +
      '<option value="income"' + (accFilter.type === 'income' ? ' selected' : '') + '>' + t('دریافت‌ها') + '</option>' +
      '<option value="expense"' + (accFilter.type === 'expense' ? ' selected' : '') + '>' + t('پرداخت‌ها') + '</option></select>' +
      '<select class="input select" id="afS" style="width:auto"><option value="">' + t('همه بخش‌ها') + '</option>' +
      Object.entries(Trx_SRC_L).map(([k, l]) => '<option value="' + k + '"' + (accFilter.source === k ? ' selected' : '') + '>' + esc(t(l)) + '</option>').join('') + '</select>' +
      '<input class="input" type="date" id="afFrom" value="' + esc(accFilter.from) + '" style="width:auto">' +
      '<input class="input" type="date" id="afTo" value="' + esc(accFilter.to) + '" style="width:auto">' +
      '<div class="searchbox">' + ic('search') + '<input class="input" id="afQ" placeholder="' + t('جستجو در شرح یا شماره تراکنش') + '" value="' + esc(accFilter.q) + '"></div>' +
    '</div>' +
    '<div class="grid" style="margin-bottom:12px">' +
    statCard('arrowD', 'ic-green', money(inSum), t('مجموع دریافت‌ها (نتایج فیلتر)')) +
    statCard('arrowU', 'ic-rose', money(outSum), t('مجموع پرداخت‌ها (نتایج فیلتر)')) +
    statCard('chart', inSum - outSum >= 0 ? 'ic-sky' : 'ic-rose', money(inSum - outSum), t('مانده')) + '</div>' +
    tableEl([{ h: t('شماره') }, { h: t('تاریخ') }, { h: t('شرح') }, { h: t('بخش') }, { h: t('مبلغ') }, { h: t('روش') }, { h: t('کاربر') }, { h: '' }],
      list.slice(0, 200).map(x => ({ cells: [
        { v: '<b class="num fs-s">' + esc(x.no) + '</b>' },
        { v: fmtJG(x.date) + '<br><small class="text-dim num">' + fa(x.time || '') + '</small>' },
        { v: '<span class="fs-s">' + esc(x.note || '—') + '</span>' + (x.inv ? ' <span class="badge b-violet">' + t('مربوط به موجودی') + '</span>' : '') },
        { v: '<span class="badge ' + (x.type === 'income' ? 'b-green' : 'b-red') + '">' + esc(t(Trx_SRC_L[x.source] || x.source)) + '</span>' },
        { v: '<b class="num ' + (x.type === 'income' ? 'text-ok' : 'text-bad') + '">' + (x.type === 'income' ? '+' : '−') + money(x.amount) + '</b>' },
        { v: esc(t(PAY_METHOD[x.method] || x.method)) },
        { v: '<span class="fs-xs text-dim">' + esc(x.userName || '') + '</span>' },
        { v: accTrxActs(x), cls: 'acts' }
      ] })), { empty: t('تراکنشی یافت نشد') });
  body.querySelector('#afT').onchange = e => { accFilter.type = e.target.value; Pages.accounting(document.getElementById('view')); };
  body.querySelector('#afS').onchange = e => { accFilter.source = e.target.value; Pages.accounting(document.getElementById('view')); };
  body.querySelector('#afFrom').onchange = e => { accFilter.from = e.target.value; Pages.accounting(document.getElementById('view')); };
  body.querySelector('#afTo').onchange = e => { accFilter.to = e.target.value; Pages.accounting(document.getElementById('view')); };
  body.querySelector('#afQ').oninput = debounce(e => { accFilter.q = e.target.value; Pages.accounting(document.getElementById('view')); }, 250);
  body.querySelectorAll('[data-act]').forEach(b => b.onclick = () => accTrxAction(b.dataset.act, b.dataset.id));
}
function accTrxActs(x) {
  let h = '';
  if (x.type === 'income' && can('accounting', 'p'))
    h += '<button class="iconbtn" data-act="print" data-id="' + x.id + '" title="' + t('چاپ رسید') + '">' + ic('printer') + '</button>';
  if (can('accounting', 'e')) h += '<button class="iconbtn" data-act="edit" data-id="' + x.id + '" title="' + t('اصلاح مبلغ') + '">' + ic('edit') + '</button>';
  if (can('accounting', 'd')) h += '<button class="iconbtn" data-act="void" data-id="' + x.id + '" title="' + t('ابطال') + '">' + ic('x') + '</button>';
  return h || '—';
}
async function accTrxAction(act, id) {
  const x = await DB.get('transactions', id);
  if (!x) return;
  if (act === 'print') return printTrxReceipt(x);
  if (act === 'edit') {
    const reason = await guardClosed(x.date);
    if (reason === null) return;
    const r = await UI.form([
      { k: 'amount', label: t('مبلغ جدید (؋)'), type: 'number', val: x.amount, req: true },
      { k: 'note', label: t('شرح'), val: x.note }
    ], { title: t('اصلاح تراکنش') + ' ' + x.no, submit: t('ذخیره') });
    if (!r) return;
    const changes = { amount: [x.amount, num(r.amount)], note: [x.note, r.note] };
    x.amount = num(r.amount); x.note = r.note; x.editedAt = nowFull(); x.editedBy = session.user.name; x.editReason = reason || '';
    await DB.put('transactions', x);
    await Audit.log('trx-edit', 'accounting', id, x.no + ' — ' + money(x.amount), reason || '');
    UI.toast(t('تراکنش اصلاح شد (با ثبت سابقه)'), 'ok');
    Pages.accounting(document.getElementById('view'));
  }
  if (act === 'void') {
    const reason = await guardClosed(x.date);
    if (reason === null || !reason) { if (reason === '') UI.toast(t('ثبت دلیل ابطال الزامی است'), 'warn'); return; }
    if (!(await UI.confirm(t('تراکنش ابطال شود؟ سابقه آن حفظ می‌شود و از محاسبات حذف می‌گردد'), { danger: true }))) return;
    x.voided = true; x.voidReason = reason; x.voidedBy = session.user.name; x.voidedAt = nowFull();
    await DB.put('transactions', x);
    await Audit.log('trx-void', 'accounting', id, x.no + ' — ' + money(x.amount), reason);
    UI.toast(t('تراکنش ابطال شد'), 'ok');
    Pages.accounting(document.getElementById('view'));
  }
}
async function openReceiveForm() {
  const services = (await DB.all('services')).filter(s => s.active && !s.deleted);

  const m = UI.modal({
    title: t('ثبت دریافت عواید'), wide: true,

      '<div class="field"><label>' + t('مریض (اختیاری)') + '</label>' +

  });
  m.el.querySelector('[data-vc]').onclick = () => m.close();
  m.el.querySelector('#rvPick').onclick = async () => {
    const pts = (await DB.all('patients')).filter(p => !p.deleted);

    if (v) { patientId = v; patientName = pName(await DB.get('patients', v)); m.el.querySelector('#rvPat').value = patientName; }
  };
  let paidTouched = false;
  const upd = () => {
    let tot = num(m.el.querySelector('#rvOther').value);
    m.el.querySelectorAll('[data-svc]').forEach(c => { if (c.checked) tot += num(c.dataset.price); });
    m.el.querySelector('#rvSum').textContent = money(tot);
    if (!paidTouched) m.el.querySelector('#rvPaid').value = tot;

  };
  m.el.querySelectorAll('[data-svc]').forEach(c => c.onchange = upd);
  m.el.querySelector('#rvOther').oninput = upd;
  m.el.querySelector('#rvPaid').oninput = () => { paidTouched = true; };
  upd();
  m.el.querySelector('[data-vs]').onclick = async () => {
    const items = [];

    const other = num(m.el.querySelector('#rvOther').value);
    if (other > 0) items.push({ label: m.el.querySelector('#rvNote').value.trim() || t('سایر دریافت'), amount: other });
    if (!items.length) { UI.toast(t('حداقل یک خدمت یا مبلغ وارد کنید'), 'bad'); return; }
    const total = sum(items, i => i.amount);
    const paid = Math.min(num(m.el.querySelector('#rvPaid').value), total);
    if (paid <= 0) { UI.toast(t('مبلغ دریافت نامعتبر است'), 'bad'); return; }
    const method = m.el.querySelector('#rvMethod').value;
    const note = m.el.querySelector('#rvNote').value.trim() || t('دریافت عواید خدمات');

    if (paid < total && patientId) {
      await createDebt({ partyType: 'patient', partyId: patientId, partyName: patientName, amount: total - paid,
        label: note + ' — ' + t('باقی‌مانده'), refType: 'manual', refId: (trx && trx.id) || uid() });
      UI.toast(t('باقی‌مانده به بدهی مریض اضافه شد') + ': ' + money(total - paid), 'warn', 4500);
    }

    const pr = await UI.confirm(t('چاپ رسید دریافت اکنون انجام شود؟'), { yes: t('بلی، چاپ رسید') });
    if (pr && trx) printTrxReceipt(trx);
    m.close();
  };
}
async function accDebts(body, kind) {

async function accPL(body) {
  const trxs = (await DB.all('transactions')).filter(x => !x.voided);
  const debts = await DB.all('debts');
  const today = nowISO();
  const ranges = [['این ماه', monthKey(today), x => monthKey(x.date) === monthKey(today)], ['امسال', String(jOf(today).jy), x => jOf(x.date).jy === jOf(today).jy]];
  const bal = await cashBalances();
  let html = '<div class="grid">' + statCard('wallet', 'ic-green', money(bal.cash + bal.bank), t('موجودی کل (نقدی + بانک)')) +
    statCard('coins', 'ic-rose', money(sum(debts.filter(d => d.partyType === 'patient' && d.status === 'open'), d => d.amount - d.paid)), t('مطالبات از مریضان')) +
    statCard('bank', 'ic-amber', money(sum(debts.filter(d => d.partyType === 'supplier' && d.status === 'open'), d => d.amount - d.paid)), t('بدهی به تأمین‌کنندگان')) + '</div>';
  for (const [lbl] of ranges) {
    const f = ranges.find(r => r[0] === lbl)[2];
    const L = trxs.filter(x => f(x) && x.type === 'income');
    const E = trxs.filter(x => f(x) && x.type === 'expense');
    const inc = sum(L, x => x.amount);
    const opex = sum(E.filter(x => !x.inv), x => x.amount);
    const inv = sum(E.filter(x => x.inv), x => x.amount);
    const net = inc - opex - inv;
    html += '<div class="card" style="margin-top:14px"><h3>' + ic('chart') + t('سود و زیان') + ' — ' + esc(lbl) + ' (' + t('مبنای نقدی، از تراکنش‌های واقعی') + ')</h3>' +
      '<div class="kv"><b>' + t('مجموع عواید') + '</b><span class="num text-ok">' + money(inc) + '</span></div>' +
      '<div class="kv"><b>' + t('مصارف عملیاتی') + '</b><span class="num text-bad">−' + money(opex) + '</span></div>' +
